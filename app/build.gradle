plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mintlab.pkgprobe'
    compileSdk 35

    defaultConfig {
        applicationId "com.mintlab.rawprobe"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }
}
