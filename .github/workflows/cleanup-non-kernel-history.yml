name: One-time public Actions cleanup

on:
  push:
    paths:
      - .github/workflows/cleanup-non-kernel-history.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: preserve-kernel-runs-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Remove 42 non-kernel runs while retaining 51 kernel runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          hdr=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          get() { curl --fail-with-body -sSL --retry 3 "${hdr[@]}" "${api}/$1"; }
          del() { curl --fail-with-body -sSL --retry 3 -X DELETE "${hdr[@]}" "${api}/$1" -o /dev/null; }

          snapshot="$(mktemp)"
          for page in $(seq 1 20); do
            data="$(get "actions/runs?per_page=100&page=${page}")"
            jq -r '.workflow_runs[] | [.id, .path] | @tsv' <<<"${data}" >> "${snapshot}"
            (( $(jq '.workflow_runs | length' <<<"${data}") < 100 )) && break
          done

          kernel=0
          targets=()
          unknown=()
          while IFS=$'\t' read -r id workflow; do
            [[ "$id" == "${GITHUB_RUN_ID}" ]] && continue
            case "$workflow" in
              .github/workflows/Build-ReSukiSU-StockSched.yml|.github/workflows/Build-SukiSU.yml|.github/workflows/Build-Stock-A67.yml)
                kernel=$((kernel+1));;
              .github/workflows/repo-maintenance.yml|.github/workflows/a67-private-space-stage1.yml|.github/workflows/a67-private-space-stage2.yml|.github/workflows/a67-private-space-stage3.yml|.github/workflows/build-package-visibility-probe.yml|.github/workflows/export-apksigner.yml|.github/workflows/package-visibility-probe-manual.yml|.github/workflows/Find-Clang14043575.yml|.github/workflows/Export-ApkSigner.yml|.github/workflows/build-termux-mintlab.yml|.github/workflows/build-aurel-terminal.yml)
                targets+=("$id");;
              *) unknown+=("${workflow} ${id}");;
            esac
          done < <(sort -u -k1,1 "${snapshot}")
          echo "Preflight: kernel runs=${kernel}; non-kernel runs=${#targets[@]}; unexpected=${#unknown[@]}"
          if [[ ${kernel} -ne 51 || ${#targets[@]} -ne 42 || ${#unknown[@]} -ne 0 ]]; then
            printf 'Unexpected workflows: %s\n' "${unknown[@]}"
            echo "::error::Preflight counts changed, refusing any deletion."
            exit 1
          fi

          for id in "${targets[@]}"; do
            del "actions/runs/${id}"
            echo "Deleted non-kernel workflow run ${id}"
          done

          # Deleting an Actions run removes that run's logs and artifacts.
          after="$(get "actions/runs?per_page=100")"
          rest="$(jq '[.workflow_runs[] | select(.id != (env.GITHUB_RUN_ID|tonumber))] | length' <<<"${after}")"
          remaining_other="$(jq '[.workflow_runs[] | select(.id != (env.GITHUB_RUN_ID|tonumber)) | select(.path != ".github/workflows/Build-ReSukiSU-StockSched.yml" and .path != ".github/workflows/Build-SukiSU.yml" and .path != ".github/workflows/Build-Stock-A67.yml")] | length' <<<"${after}")"
          if [[ "${rest}" -ne 51 || "${remaining_other}" -ne 0 ]]; then
            echo "::error::Postcheck failed: remaining=${rest}, non-kernel=${remaining_other}"
            exit 1
          fi
          echo "Verified: 51 original kernel build runs preserved; all 42 original non-kernel runs removed."
