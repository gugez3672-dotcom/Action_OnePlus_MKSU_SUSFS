name: Build APK Raw Read Probe

on:
  push:
    branches:
      - apk-raw-read-probe-20260921
    paths:
      - 'settings.gradle'
      - 'build.gradle'
      - 'app/**'
      - '.github/workflows/build-package-visibility-probe.yml'
      - '.github/raw-read-trigger'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build probe APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/APK-Raw-Read-Probe.apk
          sha256sum out/APK-Raw-Read-Probe.apk | tee out/SHA256SUMS.txt

      - name: Upload probe APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-raw-read-probe
          path: out/*
          if-no-files-found: error
