name: Repository maintenance

on:
  push:
    paths:
      - .github/workflows/repo-maintenance.yml

permissions:
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prune temporary maintenance runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          for run in 39104855683 39104903356; do
            curl --fail-with-body -sSL -X DELETE "${headers[@]}" "${url}/actions/runs/${run}" -o /dev/null
          done
          echo "Completed."
