name: Build Custom ReSukiSU Manager

on:
  push:
    branches:
      - resukisu-manager-dual-20260921
    paths:
      - '.github/workflows/Build-Custom-ReSukiSU-Manager.yml'
      - '.github/build_dual.sh'
      - '.github/dn_patch.py'
      - '.github/dailynotes-dual-trigger'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build permanent-signed dual managers
        env:
          MANAGER_KEYSTORE_B64: ${{ secrets.MANAGER_KEYSTORE_B64 }}
          MANAGER_KEYSTORE_PASSWORD: ${{ secrets.MANAGER_KEYSTORE_PASSWORD }}
        run: bash .github/build_dual.sh
      - uses: actions/upload-artifact@v7
        with:
          name: DailyNotes-2.4.3-dual-final
          path: out/*
          retention-days: 30
