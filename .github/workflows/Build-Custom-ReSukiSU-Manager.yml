name: Build Custom ReSukiSU Manager

on:
  workflow_dispatch:
  push:
    branches:
      - resukisu-custom-manager
    paths:
      - '.github/workflows/Build-Custom-ReSukiSU-Manager.yml'
      - '.github/custom-manager-trigger'

permissions:
  contents: write

env:
  RESUKISU_COMMIT: 6ec8d9a8a8be30878c388504cacf8ae7849c757b
  UPSTREAM_MANAGER_RUN: '35234729417'
  CUSTOM_PACKAGE: com.daily.notes
  KEY_ALIAS: notes
  EXPECTED_CERT_SHA256: 7b6fcd9e7f440833ee8a5a3860f3ff5b7b367a0dabb36c1d5f0fd52064bf283e

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build trigger
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone exact ReSukiSU source
        run: |
          set -euo pipefail
          git clone https://github.com/ReSukiSU/ReSukiSU.git source
          git -C source checkout "${RESUKISU_COMMIT}"
          test "$(git -C source rev-parse HEAD)" = "${RESUKISU_COMMIT}"

      - name: Patch runtime package only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          pkg = "com.daily.notes"
          gradle = Path("source/manager/app/build.gradle.kts")
          text = gradle.read_text()

          if 'applicationId = "' in text:
              import re
              text = re.sub(r'applicationId\s*=\s*"[^"]+"', f'applicationId = "{pkg}"', text, count=1)
          else:
              anchor = "        versionName = managerVersionName\n"
              if text.count(anchor) != 1:
                  raise SystemExit("unexpected app build.gradle layout")
              text = text.replace(anchor, anchor + f'        applicationId = "{pkg}"\n', 1)
          gradle.write_text(text)

          # Match the visible application name to the ordinary package identity.
          strings = Path("source/manager/app/src/main/res/values/strings.xml")
          t = strings.read_text()
          old_name = '<string name="app_name" translatable="false">ReSukiSU</string>'
          new_name = '<string name="app_name" translatable="false">Daily Notes</string>'
          if old_name not in t:
              raise SystemExit("unexpected app_name resource")
          strings.write_text(t.replace(old_name, new_name, 1))

          # Replace self-owned action/authority strings without touching Kotlin/Java namespaces.
          replacements = {
              "com.resukisu.resukisu.magica.LAUNCH": f"{pkg}.magica.LAUNCH",
              "com.resukisu.resukisu.action.DOWNLOAD_MANAGER_APK": f"{pkg}.action.DOWNLOAD_MANAGER_APK",
              "com.resukisu.resukisu.action.DISMISS_DOWNLOAD": f"{pkg}.action.DISMISS_DOWNLOAD",
              "com.resukisu.resukisu.action.CANCEL_DOWNLOAD": f"{pkg}.action.CANCEL_DOWNLOAD",
              "com.resukisu.resukisu.action.INSTALL_MODULE": f"{pkg}.action.INSTALL_MODULE",
              "com.resukisu.resukisu.action.DOWNLOAD": f"{pkg}.action.DOWNLOAD",
          }
          targets = [
              Path("source/manager/app/src/main/AndroidManifest.xml"),
              Path("source/manager/app/src/main/java/com/resukisu/resukisu/magica/BootCompletedReceiver.java"),
              Path("source/manager/app/src/main/java/com/resukisu/resukisu/data/download/DownloadService.kt"),
          ]
          for p in targets:
              t = p.read_text()
              for old, new in replacements.items():
                  t = t.replace(old, new)
              p.write_text(t)

          # Private manager: no launcher/deep-link/share entry points and no
          # exported app components. This keeps ordinary apps behind Android's
          # native package-visibility / AppsFilter boundary.
          import xml.etree.ElementTree as ET
          ANDROID_NS = "http://schemas.android.com/apk/res/android"
          TOOLS_NS = "http://schemas.android.com/tools"
          ET.register_namespace("android", ANDROID_NS)
          ET.register_namespace("tools", TOOLS_NS)
          manifest = Path("source/manager/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          app = root.find("application")
          if app is None:
              raise SystemExit("manifest application node missing")

          def aname(node):
              return node.get(f"{{{ANDROID_NS}}}name")

          main = next((x for x in app.findall("activity") if aname(x) == ".ui.MainActivity"), None)
          if main is None:
              raise SystemExit("MainActivity missing")
          main.set(f"{{{ANDROID_NS}}}exported", "false")
          main.set(f"{{{ANDROID_NS}}}enabled", "true")
          for filt in list(main.findall("intent-filter")):
              main.remove(filt)

          alias = next((x for x in app.findall("activity-alias") if aname(x) == ".ui.MainActivityAlias"), None)
          if alias is None:
              raise SystemExit("MainActivityAlias missing")
          alias.set(f"{{{ANDROID_NS}}}exported", "false")
          alias.set(f"{{{ANDROID_NS}}}enabled", "false")
          for filt in list(alias.findall("intent-filter")):
              alias.remove(filt)

          receiver = next((x for x in app.findall("receiver") if aname(x) == ".magica.BootCompletedReceiver"), None)
          if receiver is None:
              raise SystemExit("BootCompletedReceiver missing")
          receiver.set(f"{{{ANDROID_NS}}}exported", "false")

          # Fail closed if any app-owned component remains exported.
          for tag in ("activity", "activity-alias", "service", "receiver", "provider"):
              for node in app.findall(tag):
                  if node.get(f"{{{ANDROID_NS}}}exported") == "true":
                      raise SystemExit(f"unexpected exported component: {tag} {aname(node)}")

          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          # Match official KernelSU behavior: enumerate every alive Android user from
          # the root service, not UserManager.userProfiles of the manager's current user.
          # This makes user 0 and user 10 applications appear together with distinct UIDs.
          ksu_service = Path("source/manager/app/src/main/java/com/resukisu/resukisu/data/packageinfo/KsuService.kt")
          t = ksu_service.read_text()
          t = t.replace("import android.os.UserHandle\n", "", 1)

          old_load = (
              '    private fun loadAllPackages(): List<PackageInfo> {\n'
              '        val tmp = arrayListOf<PackageInfo>()\n'
              '        for (user in (getSystemService(USER_SERVICE) as UserManager).userProfiles) {\n'
              '            val userId = user.getUserIdCompat()\n'
              '            tmp += getInstalledPackagesAsUser(userId)\n'
              '        }\n'
              '        return tmp\n'
              '    }\n'
          )
          new_load = (
              '    private fun getAllUserIds(): IntArray {\n'
              '        val um = getSystemService(USER_SERVICE) as UserManager\n'
              '        return try {\n'
              '            val method = um.javaClass.getMethod("getAliveUsers")\n'
              '            val users = method.invoke(um) as List<*>\n'
              '            extractUserIds(users)\n'
              '        } catch (e: Exception) {\n'
              '            Log.e(TAG, "getAliveUsers reflection failed", e)\n'
              '            intArrayOf(0)\n'
              '        }\n'
              '    }\n\n'
              '    private fun extractUserIds(users: List<*>?): IntArray {\n'
              '        if (users.isNullOrEmpty()) return intArrayOf(0)\n'
              '        return try {\n'
              '            users.map { user ->\n'
              '                user!!.javaClass.getField("id").getInt(user)\n'
              '            }.distinct().sorted().toIntArray()\n'
              '        } catch (e: Exception) {\n'
              '            Log.e(TAG, "Error extracting ID from UserInfo", e)\n'
              '            intArrayOf(0)\n'
              '        }\n'
              '    }\n\n'
              '    private fun loadAllPackages(): List<PackageInfo> {\n'
              '        val tmp = arrayListOf<PackageInfo>()\n'
              '        for (userId in getAllUserIds()) {\n'
              '            Log.i(TAG, "loadAllPackages userId=$userId")\n'
              '            tmp += getInstalledPackagesAsUser(userId)\n'
              '        }\n'
              '        return tmp\n'
              '    }\n'
          )
          if t.count(old_load) != 1:
              raise SystemExit("unexpected KsuService loadAllPackages implementation")
          t = t.replace(old_load, new_load, 1)

          helper_start = t.find("    private fun UserHandle.getUserIdCompat(): Int {")
          if helper_start < 0:
              raise SystemExit("old UserHandle helper missing")
          helper_end = t.index("\n    }\n}", helper_start)
          t = t[:helper_start] + t[helper_end + len("\n    }"):]
          if ".userProfiles" in t or "getUserIdCompat" in t:
              raise SystemExit("current-user-only package enumeration still present")
          if 'getMethod("getAliveUsers")' not in t:
              raise SystemExit("all-user enumeration patch missing")
          ksu_service.write_text(t)

          # Hidden/private build has no launcher entry. The upstream alternate-icon
          # switch must never toggle MainActivity/MainActivityAlias because doing so
          # can disable the only explicitly launchable Activity.
          settings_repo = Path("source/manager/app/src/main/java/com/resukisu/resukisu/data/settings/SettingsPlatformRepository.kt")
          t = settings_repo.read_text()

          old_snapshot = '            useAltIcon = settings.getBoolean("use_alt_icon", false),\n'
          if t.count(old_snapshot) != 1:
              raise SystemExit("unexpected alternate-icon snapshot implementation")
          t = t.replace(old_snapshot, '            useAltIcon = false,\n', 1)

          old_branch = (
              '            is PlatformSetting.AlternateIcon -> {\n'
              '                settings.putBoolean("use_alt_icon", setting.enabled)\n'
              '                toggleLauncherIcon(setting.enabled)\n'
              '            }\n'
          )
          new_branch = (
              '            is PlatformSetting.AlternateIcon ->\n'
              '                settings.putBoolean("use_alt_icon", false)\n'
          )
          if t.count(old_branch) != 1:
              raise SystemExit("unexpected alternate-icon update implementation")
          t = t.replace(old_branch, new_branch, 1)

          fn_start = t.index("    private fun toggleLauncherIcon(useAlt: Boolean) {")
          fn_end = t.index("\n    private fun loadModuleUpdatePreference()", fn_start)
          t = t[:fn_start] + t[fn_end + 1:]
          settings_repo.write_text(t)

          # Remove the alternate-icon control from the hidden manager UI.
          theme_settings = Path("source/manager/app/src/main/java/com/resukisu/resukisu/ui/screen/themeSettings/ThemeSettings.kt")
          t = theme_settings.read_text()
          t = t.replace("import androidx.compose.material.icons.twotone.Android\n", "", 1)
          icon_item = (
              '        item {\n'
              '            // 图标切换\n'
              '            SettingsSwitchWidget(\n'
              '                icon = Icons.TwoTone.Android,\n'
              '                title = stringResource(R.string.icon_switch_title),\n'
              '                description = stringResource(R.string.icon_switch_summary),\n'
              '                checked = settingsUiState.useAltIcon,\n'
              '                onCheckedChange = { enabled ->\n'
              '                    settingsViewModel.dispatch(SettingsUiAction.SetAlternateIcon(enabled))\n'
              '                }\n'
              '            )\n'
              '        }\n\n'
          )
          if t.count(icon_item) != 1:
              raise SystemExit("unexpected alternate-icon UI layout")
          theme_settings.write_text(t.replace(icon_item, "", 1))

          # Fail closed: the private build must contain no code path that toggles
          # MainActivity/MainActivityAlias through the alternate-icon setting.
          repo_text = settings_repo.read_text()
          if "toggleLauncherIcon(" in repo_text:
              raise SystemExit("alternate-icon component toggle still present")

          # Minimal premium Daily Notes adaptive icon.
          # Graphite background + warm ivory note glyph; no anime/original artwork remains.
          colors = Path("source/manager/app/src/main/res/values/colors.xml")
          t = colors.read_text()
          old_bg = '<color name="ic_launcher_background">#FFFFFF</color>'
          new_bg = '<color name="ic_launcher_background">#1B1E23</color>'
          if old_bg not in t:
              raise SystemExit("unexpected launcher background color")
          colors.write_text(t.replace(old_bg, new_bg, 1))

          premium_icon = dedent("""\
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#F4F1EA"
                  android:pathData="M33,20 L67,20 Q72,20 76,24 L82,30 Q86,34 86,39 L86,79 Q86,88 77,88 L33,88 Q24,88 24,79 L24,29 Q24,20 33,20 Z" />
              <path
                  android:fillColor="#C9A96E"
                  android:pathData="M68,20 L86,38 L75,38 Q68,38 68,31 Z" />
              <path
                  android:strokeColor="#4D535D"
                  android:strokeWidth="3.2"
                  android:strokeLineCap="round"
                  android:pathData="M39,49 L70,49 M39,60 L70,60 M39,71 L61,71" />
          </vector>
          """)
          primary_icon = Path("source/manager/app/src/main/res/drawable/ic_launcher_foreground.xml")
          primary_icon.write_text(premium_icon)

          # Keep the dormant alternate icon visually consistent if the alias is ever
          # inspected manually; hidden mode itself never enables the alias.
          alt_icon = Path("source/manager/app/src/main/res/drawable/ic_launcher_foreground_alt.xml")
          alt_icon.write_text(premium_icon)

          premium_mono = dedent("""\
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#000000"
                  android:pathData="M33,20 L67,20 L86,39 L86,79 Q86,88 77,88 L33,88 Q24,88 24,79 L24,29 Q24,20 33,20 Z M39,47 L71,47 L71,51 L39,51 Z M39,58 L71,58 L71,62 L39,62 Z M39,69 L62,69 L62,73 L39,73 Z" />
          </vector>
          """)
          primary_mono = Path("source/manager/app/src/main/res/drawable/ic_launcher_monochrome.xml")
          primary_mono.write_text(premium_mono)
          alt_mono = Path("source/manager/app/src/main/res/drawable/ic_launcher_monochrome_alt.xml")
          alt_mono.write_text(premium_mono)

          # This is a private custom manager. Its own UI must not reject the
          # custom signing certificate; kernel-side identity checks remain the
          # actual authorization boundary.
          ksu_cli = Path("source/manager/app/src/main/java/com/resukisu/resukisu/data/shell/KsuCli.kt")
          t = ksu_cli.read_text()
          start = t.index("    suspend fun isOfficialSignature")
          end = t.index("\n    suspend fun getFeatureStatus", start)
          t = t[:start] + "    suspend fun isOfficialSignature(packageResourcePath: String): Boolean = true\n" + t[end:]
          ksu_cli.write_text(t)

          # Exact-APK locking and upstream manager updates are incompatible.
          updater = Path("source/manager/app/src/main/java/com/resukisu/resukisu/domain/usecase/CheckManagerUpdateUseCase.kt")
          t = updater.read_text()
          start = t.index("    suspend operator fun invoke")
          end = t.index("\n}", start)
          t = t[:start] + "    suspend operator fun invoke(channel: ManagerUpdateChannel): ManagerUpdateInfo? = null\n" + t[end:]
          updater.write_text(t)

          out = gradle.read_text()
          assert f'applicationId = "{pkg}"' in out
          assert "isOfficialSignature(packageResourcePath: String): Boolean = true" in ksu_cli.read_text()
          assert "ManagerUpdateInfo? = null" in updater.read_text()
          assert 'getMethod("getAliveUsers")' in ksu_service.read_text()
          assert ".userProfiles" not in ksu_service.read_text()
          assert "toggleLauncherIcon(" not in settings_repo.read_text()
          assert '#1B1E23' in colors.read_text()
          PY

      - name: Validate manager patch scripts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/dn23_manager_patch.py \
            .github/dn25_tools_patch_v2.py \
            .github/dn28_tools_patch.py \
            .github/dn29_tools_fix.py \
            .github/dn30_elf_runner_fix.py \
            .github/dn31_detached_sh_runner.py

      - name: Apply launcher and tools patches
        run: |
          set -euo pipefail
          python3 .github/dn23_manager_patch.py
          git -C source show "${RESUKISU_COMMIT}:manager/app/src/main/res/drawable/ic_launcher_foreground_alt.xml" > source/manager/app/src/main/res/drawable/ic_launcher_foreground_alt.xml
          git -C source show "${RESUKISU_COMMIT}:manager/app/src/main/res/drawable/ic_launcher_monochrome_alt.xml" > source/manager/app/src/main/res/drawable/ic_launcher_monochrome_alt.xml
          python3 .github/dn25_tools_patch_v2.py
          python3 .github/dn28_tools_patch.py
          python3 .github/dn29_tools_fix.py
          python3 .github/dn30_elf_runner_fix.py
          python3 .github/dn31_detached_sh_runner.py

      - name: Restore permanent manager signing key
        working-directory: source/manager
        env:
          MANAGER_KEYSTORE_B64: ${{ secrets.MANAGER_KEYSTORE_B64 }}
          MANAGER_KEYSTORE_PASSWORD: ${{ secrets.MANAGER_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${MANAGER_KEYSTORE_B64}"
          test -n "${MANAGER_KEYSTORE_PASSWORD}"

          # GitHub's multiline secret field can preserve a trailing CR/LF when
          # the value was pasted from a text file. The actual JKS password has
          # no newline, so normalize only CR/LF here.
          KEYSTORE_PASS="$(printf '%s' "${MANAGER_KEYSTORE_PASSWORD}" | tr -d '\r\n')"
          test -n "${KEYSTORE_PASS}"

          printf '%s' "${MANAGER_KEYSTORE_B64}" | tr -d '\r\n ' | base64 --decode > key.jks
          chmod 600 key.jks

          keytool -list \
            -keystore key.jks \
            -storepass "${KEYSTORE_PASS}" \
            -alias "${KEY_ALIAS}" >/dev/null

          {
            echo "KEYSTORE_FILE=key.jks"
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASS}"
            echo "KEY_ALIAS=${KEY_ALIAS}"
            echo "KEY_PASSWORD=${KEYSTORE_PASS}"
          } >> gradle.properties

      - name: Build custom manager APK
        working-directory: source/manager
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease -Pcommit="${RESUKISU_COMMIT}"

      - name: Keep only arm64 base APK
        run: |
          set -euo pipefail
          REL=source/manager/app/build/outputs/apk/release
          ARM64=$(find "$REL" -maxdepth 1 -type f -name '*arm64-v8a*release.apk' | head -n 1)
          test -n "$ARM64"
          mkdir -p source/manager/app/build/outputs/apk/custom
          cp "$ARM64" source/manager/app/build/outputs/apk/custom/custom-base.apk
          rm -f "$REL"/*.apk
          cp source/manager/app/build/outputs/apk/custom/custom-base.apk "$REL/custom-base.apk"

      - name: Fetch exact upstream ksud from matching commit
        run: |
          set -euo pipefail
          mkdir -p upstream-ksud
          curl -fL --retry 3             "https://nightly.link/ReSukiSU/ReSukiSU/actions/runs/${UPSTREAM_MANAGER_RUN}/ksud-aarch64-linux-android.zip"             -o upstream-ksud.zip
          unzip -o upstream-ksud.zip -d upstream-ksud >/dev/null
          KSUD=$(find upstream-ksud -type f -name 'ksud' | head -n 1)
          test -n "$KSUD"
          mkdir -p source/target/aarch64-linux-android/release
          cp "$KSUD" source/target/aarch64-linux-android/release/ksud

      - name: Repack with exact ksud and v2-sign
        working-directory: source
        env:
          MANAGER_KEYSTORE_PASSWORD: ${{ secrets.MANAGER_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PASS="$(printf '%s' "${MANAGER_KEYSTORE_PASSWORD}" | tr -d '\r\n')"
          python3 repack_apk.py repack             -b release             -t release             -a arm64-v8a             -K manager/key.jks             -A "${KEY_ALIAS}"             -P "${KEYSTORE_PASS}"             -S "${KEYSTORE_PASS}"             -n ReSukiSU_v4.2.0-rc2_35154-custom             --no-strip

      - name: Verify package signature and identity
        env:
          MANAGER_KEYSTORE_PASSWORD: ${{ secrets.MANAGER_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PASS="$(printf '%s' "${MANAGER_KEYSTORE_PASSWORD}" | tr -d '\r\n')"
          APK=$(find source/dist -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"

          AAPT=$(find "${ANDROID_HOME}/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)
          test -x "$AAPT"
          test -x "$APKSIGNER"

          BADGING=$("$AAPT" dump badging "$APK")
          PKG=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)
          LABEL=$(printf '%s\n' "$BADGING" | sed -n "s/^application-label:'\([^']*\)'.*/\1/p" | head -n 1)
          echo "package=$PKG"
          echo "label=$LABEL"
          test "$PKG" = "${CUSTOM_PACKAGE}"
          test "$LABEL" = "Daily Notes"

          VERSION_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" | head -n 1)
          echo "versionName=$VERSION_NAME"
          test "$VERSION_NAME" = "V4.2.0"

          # Custom manager must have a normal desktop launcher entry.
          printf '%s\n' "$BADGING" | grep -q "^launchable-activity:"

          # Only launcher exposure is retained; deep-link/share filters stay removed.
          MANIFEST_DUMP=$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)
          printf '%s\n' "$MANIFEST_DUMP" | grep -q 'android.intent.category.LAUNCHER'
          printf '%s\n' "$MANIFEST_DUMP" | grep -q 'android.intent.action.MAIN'
          ! printf '%s\n' "$MANIFEST_DUMP" | grep -q 'android.intent.action.VIEW'
          ! printf '%s\n' "$MANIFEST_DUMP" | grep -q 'android.intent.action.SEND'
          ! printf '%s\n' "$MANIFEST_DUMP" | grep -q 'android.intent.action.SEND_MULTIPLE'
          echo "launcher_visibility=enabled"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner-verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apksigner-verify.txt

          keytool -exportcert             -alias "${KEY_ALIAS}"             -keystore source/manager/key.jks             -storepass "${KEYSTORE_PASS}"             -file manager-cert.der >/dev/null

          CERT_SIZE=$(stat -c%s manager-cert.der)
          CERT_SHA256=$(sha256sum manager-cert.der | awk '{print $1}')
          test "$CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          APK_SIZE=$(stat -c%s "$APK")

          mkdir -p custom-manager
          cp "$APK" custom-manager/ReSukiSU_v4.2.0-rc2_35154_com.daily.notes.apk
          cp apksigner-verify.txt custom-manager/
          cat > custom-manager/manager_identity.txt <<EOF
          source_commit=${RESUKISU_COMMIT}
          package=${CUSTOM_PACKAGE}
          apk_sha256=$APK_SHA256
          apk_size=$APK_SIZE
          cert_sha256=$CERT_SHA256
          cert_size=$CERT_SIZE
          signature_scheme=v2
          abi=arm64-v8a
          EOF
          cat custom-manager/manager_identity.txt

      - name: Upload custom manager
        uses: actions/upload-artifact@v7
        with:
          name: ReSukiSU-35154-com.daily.notes
          path: custom-manager/
          retention-days: 30

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp custom-manager/ReSukiSU_v4.2.0-rc2_35154_com.daily.notes.apk custom-manager/DailyNotes.apk

          if gh release view manager-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload manager-latest custom-manager/DailyNotes.apk \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create manager-latest custom-manager/DailyNotes.apk \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Daily Notes Manager" \
