name: Build Custom ReSukiSU Manager

on:
  push:
    branches:
      - resukisu-manager-relocated-20260921
    paths:
      - '.github/workflows/Build-Custom-ReSukiSU-Manager.yml'
      - '.github/custom-manager-trigger-relocated'

permissions:
  contents: read

env:
  RESUKISU_COMMIT: 6ec8d9a8a8be30878c388504cacf8ae7849c757b
  UPSTREAM_MANAGER_RUN: '35234729417'
  CUSTOM_PACKAGE: com.daily.notes
  KEY_ALIAS: notes
  KEYSTORE_PASSWORD: ChangeMe_2026_Custom_Manager
  KEY_PASSWORD: ChangeMe_2026_Custom_Manager
  EXPECTED_MANAGER_CERT_SHA256: 7b6fcd9e7f440833ee8a5a3860f3ff5b7b367a0dabb36c1d5f0fd52064bf283e
  EXPECTED_MANAGER_CERT_SIZE: "890"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout build trigger
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone exact ReSukiSU source
        run: |
          set -euo pipefail
          git clone https://github.com/ReSukiSU/ReSukiSU.git source
          git -C source checkout "${RESUKISU_COMMIT}"
          test "$(git -C source rev-parse HEAD)" = "${RESUKISU_COMMIT}"

      - name: Patch runtime package only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          pkg = "com.daily.notes"
          gradle = Path("source/manager/app/build.gradle.kts")
          text = gradle.read_text()

          if 'applicationId = "' in text:
              import re
              text = re.sub(r'applicationId\s*=\s*"[^"]+"', f'applicationId = "{pkg}"', text, count=1)
          else:
              anchor = "        versionName = managerVersionName\n"
              if text.count(anchor) != 1:
                  raise SystemExit("unexpected app build.gradle layout")
              text = text.replace(anchor, anchor + f'        applicationId = "{pkg}"\n', 1)
          gradle.write_text(text)

          # Match the visible application name to the ordinary package identity.
          strings = Path("source/manager/app/src/main/res/values/strings.xml")
          t = strings.read_text()
          old_name = '<string name="app_name" translatable="false">ReSukiSU</string>'
          new_name = '<string name="app_name" translatable="false">Daily Notes</string>'
          if old_name not in t:
              raise SystemExit("unexpected app_name resource")
          strings.write_text(t.replace(old_name, new_name, 1))

          # Replace self-owned action/authority strings without touching Kotlin/Java namespaces.
          replacements = {
              "com.resukisu.resukisu.magica.LAUNCH": f"{pkg}.magica.LAUNCH",
              "com.resukisu.resukisu.action.DOWNLOAD_MANAGER_APK": f"{pkg}.action.DOWNLOAD_MANAGER_APK",
              "com.resukisu.resukisu.action.DISMISS_DOWNLOAD": f"{pkg}.action.DISMISS_DOWNLOAD",
              "com.resukisu.resukisu.action.CANCEL_DOWNLOAD": f"{pkg}.action.CANCEL_DOWNLOAD",
              "com.resukisu.resukisu.action.INSTALL_MODULE": f"{pkg}.action.INSTALL_MODULE",
              "com.resukisu.resukisu.action.DOWNLOAD": f"{pkg}.action.DOWNLOAD",
          }
          targets = [
              Path("source/manager/app/src/main/AndroidManifest.xml"),
              Path("source/manager/app/src/main/java/com/resukisu/resukisu/magica/BootCompletedReceiver.java"),
              Path("source/manager/app/src/main/java/com/resukisu/resukisu/data/download/DownloadService.kt"),
          ]
          for p in targets:
              t = p.read_text()
              for old, new in replacements.items():
                  t = t.replace(old, new)
              p.write_text(t)

          # Private manager: no launcher/deep-link/share entry points and no
          # exported app components. This keeps ordinary apps behind Android's
          # native package-visibility / AppsFilter boundary.
          import xml.etree.ElementTree as ET
          ANDROID_NS = "http://schemas.android.com/apk/res/android"
          TOOLS_NS = "http://schemas.android.com/tools"
          ET.register_namespace("android", ANDROID_NS)
          ET.register_namespace("tools", TOOLS_NS)
          manifest = Path("source/manager/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          app = root.find("application")
          if app is None:
              raise SystemExit("manifest application node missing")

          def aname(node):
              return node.get(f"{{{ANDROID_NS}}}name")

          main = next((x for x in app.findall("activity") if aname(x) == ".ui.MainActivity"), None)
          if main is None:
              raise SystemExit("MainActivity missing")
          main.set(f"{{{ANDROID_NS}}}exported", "false")
          for filt in list(main.findall("intent-filter")):
              main.remove(filt)

          alias = next((x for x in app.findall("activity-alias") if aname(x) == ".ui.MainActivityAlias"), None)
          if alias is None:
              raise SystemExit("MainActivityAlias missing")
          alias.set(f"{{{ANDROID_NS}}}exported", "false")
          alias.set(f"{{{ANDROID_NS}}}enabled", "false")
          for filt in list(alias.findall("intent-filter")):
              alias.remove(filt)

          receiver = next((x for x in app.findall("receiver") if aname(x) == ".magica.BootCompletedReceiver"), None)
          if receiver is None:
              raise SystemExit("BootCompletedReceiver missing")
          receiver.set(f"{{{ANDROID_NS}}}exported", "false")

          # Fail closed if any app-owned component remains exported.
          for tag in ("activity", "activity-alias", "service", "receiver", "provider"):
              for node in app.findall(tag):
                  if node.get(f"{{{ANDROID_NS}}}exported") == "true":
                      raise SystemExit(f"unexpected exported component: {tag} {aname(node)}")

          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          # Fix launcher icon switching after applicationId changes.
          settings_repo = Path("source/manager/app/src/main/java/com/resukisu/resukisu/data/settings/SettingsPlatformRepository.kt")
          t = settings_repo.read_text()
          old = (
              '        val packageName = application.packageName\n'
              '        val main = ComponentName(packageName, "$packageName.ui.MainActivity")\n'
              '        val alias = ComponentName(packageName, "$packageName.ui.MainActivityAlias")\n'
          )
          new = (
              '        val packageName = application.packageName\n'
              '        val main = ComponentName(packageName, "com.resukisu.resukisu.ui.MainActivity")\n'
              '        val alias = ComponentName(packageName, "com.resukisu.resukisu.ui.MainActivityAlias")\n'
          )
          if t.count(old) != 1:
              raise SystemExit("unexpected launcher icon toggle implementation")
          settings_repo.write_text(t.replace(old, new, 1))

          # Replace only the primary anime artwork with a notebook icon.
          primary_icon = Path("source/manager/app/src/main/res/drawable/ic_launcher_foreground.xml")
          primary_icon.write_text(dedent("""\
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FFFDF7" android:strokeColor="#3D4652" android:strokeWidth="3.8" android:strokeLineJoin="round"
                  android:pathData="M31,20 L75,20 Q82,20 82,27 L82,83 Q82,88 77,88 L31,88 Q26,88 26,83 L26,25 Q26,20 31,20 Z" />
              <path android:fillColor="#F4C95D" android:strokeColor="#3D4652" android:strokeWidth="3.0" android:strokeLineJoin="round"
                  android:pathData="M66,20 L82,36 L72,36 Q66,36 66,30 Z" />
              <path android:strokeColor="#66717F" android:strokeWidth="3.2" android:strokeLineCap="round"
                  android:pathData="M39,43 L69,43 M39,54 L69,54 M39,65 L62,65" />
              <path android:fillColor="#3D4652"
                  android:pathData="M22,31 A3,3 0,1 0,28 31 A3,3 0,1 0,22 31 M22,45 A3,3 0,1 0,28 45 A3,3 0,1 0,22 45 M22,59 A3,3 0,1 0,28 59 A3,3 0,1 0,22 59 M22,73 A3,3 0,1 0,28 73 A3,3 0,1 0,22 73" />
          </vector>
          """))

          primary_mono = Path("source/manager/app/src/main/res/drawable/ic_launcher_monochrome.xml")
          primary_mono.write_text(dedent("""\
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#000000"
                  android:pathData="M31,20 L70,20 L82,32 L82,83 Q82,88 77,88 L31,88 Q26,88 26,83 L26,25 Q26,20 31,20 Z M39,42 L70,42 L70,46 L39,46 Z M39,53 L70,53 L70,57 L39,57 Z M39,64 L63,64 L63,68 L39,68 Z M22,28 L28,28 L28,34 L22,34 Z M22,42 L28,42 L28,48 L22,48 Z M22,56 L28,56 L28,62 L22,62 Z M22,70 L28,70 L28,76 L22,76 Z" />
          </vector>
          """))

          # This is a private custom manager. Its own UI must not reject the
          # custom signing certificate; kernel-side identity checks remain the
          # actual authorization boundary.
          ksu_cli = Path("source/manager/app/src/main/java/com/resukisu/resukisu/data/shell/KsuCli.kt")
          t = ksu_cli.read_text()
          start = t.index("    suspend fun isOfficialSignature")
          end = t.index("\n    suspend fun getFeatureStatus", start)
          t = t[:start] + "    suspend fun isOfficialSignature(packageResourcePath: String): Boolean = true\n" + t[end:]
          ksu_cli.write_text(t)

          # Exact-APK locking and upstream manager updates are incompatible.
          updater = Path("source/manager/app/src/main/java/com/resukisu/resukisu/domain/usecase/CheckManagerUpdateUseCase.kt")
          t = updater.read_text()
          start = t.index("    suspend operator fun invoke")
          end = t.index("\n}", start)
          t = t[:start] + "    suspend operator fun invoke(channel: ManagerUpdateChannel): ManagerUpdateInfo? = null\n" + t[end:]
          updater.write_text(t)

          out = gradle.read_text()
          assert f'applicationId = "{pkg}"' in out
          assert "isOfficialSignature(packageResourcePath: String): Boolean = true" in ksu_cli.read_text()
          assert "ManagerUpdateInfo? = null" in updater.read_text()
          PY

      - name: Relocate internal namespace and public component names
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("source/manager")

          text_ext = {".kt", ".java", ".xml", ".kts", ".gradle", ".properties", ".pro", ".txt", ".c", ".cc", ".cpp", ".h", ".hpp", ".rs", ".toml", ".json"}
          replacements = [
              ("com.resukisu.resukisu", "com.daily.notes"),
              ("com/resukisu/resukisu", "com/daily/notes"),
              ("Java_com_resukisu_resukisu", "Java_com_daily_notes"),
              ("KernelSUApplication", "NotesApplication"),
              ("MainActivityAlias", "NotesAlias"),
              ("MainActivity", "NotesActivity"),
              ("WebUIActivity", "DocumentActivity"),
              ("BackgroundCropActivity", "ImageCropActivity"),
              ("MagicaService", "SyncService"),
              ("DownloadService", "TransferService"),
              ("BootCompletedReceiver", "StartupReceiver"),
              ("AppZygotePreload", "PreloadInitializer"),
          ]

          changed = 0
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in text_ext:
                  continue
              try:
                  t = p.read_text()
              except UnicodeDecodeError:
                  continue
              nt = t
              for old, new in replacements:
                  nt = nt.replace(old, new)
              if nt != t:
                  p.write_text(nt)
                  changed += 1

          # Java public classes must keep filename == public class name.
          renames = {
              root / "app/src/main/java/com/resukisu/resukisu/KernelSUApplication.kt": root / "app/src/main/java/com/resukisu/resukisu/NotesApplication.kt",
              root / "app/src/main/java/com/resukisu/resukisu/magica/MagicaService.java": root / "app/src/main/java/com/resukisu/resukisu/magica/SyncService.java",
              root / "app/src/main/java/com/resukisu/resukisu/magica/BootCompletedReceiver.java": root / "app/src/main/java/com/resukisu/resukisu/magica/StartupReceiver.java",
              root / "app/src/main/java/com/resukisu/resukisu/magica/AppZygotePreload.java": root / "app/src/main/java/com/resukisu/resukisu/magica/PreloadInitializer.java",
          }
          for src, dst in renames.items():
              if src.exists():
                  src.rename(dst)

          print(f"relocated_text_files={changed}")

          # Fail closed: public runtime namespace and obvious component names
          # must no longer expose ReSukiSU identity.
          bad_tokens = [
              "com.resukisu.resukisu",
              "com/resukisu/resukisu",
              "Java_com_resukisu_resukisu",
          ]
          leftovers = []
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in text_ext:
                  continue
              try:
                  t = p.read_text()
              except UnicodeDecodeError:
                  continue
              for token in bad_tokens:
                  if token in t:
                      leftovers.append((str(p), token))
          if leftovers:
              raise SystemExit("namespace leftovers: " + repr(leftovers[:20]))
          PY

      - name: Restore permanent Daily Notes signing key
        working-directory: source/manager
        env:
          MANAGER_KEYSTORE_B64: ${{ secrets.MANAGER_KEYSTORE_B64 }}
          MANAGER_KEYSTORE_PASSWORD: ${{ secrets.MANAGER_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MANAGER_KEYSTORE_B64"
          test -n "$MANAGER_KEYSTORE_PASSWORD"
          printf '%s' "$MANAGER_KEYSTORE_B64" | base64 -d > key.jks
          test -s key.jks

          keytool -list -keystore key.jks -storepass "$MANAGER_KEYSTORE_PASSWORD" -alias "${KEY_ALIAS}" >/dev/null
          keytool -exportcert             -alias "${KEY_ALIAS}"             -keystore key.jks             -storepass "$MANAGER_KEYSTORE_PASSWORD"             -file manager-cert.der >/dev/null

          CERT_SIZE=$(stat -c%s manager-cert.der)
          CERT_SHA256=$(sha256sum manager-cert.der | awk '{print $1}')
          echo "permanent_cert_size=$CERT_SIZE"
          echo "permanent_cert_sha256=$CERT_SHA256"
          test "$CERT_SIZE" = "$EXPECTED_MANAGER_CERT_SIZE"
          test "$CERT_SHA256" = "$EXPECTED_MANAGER_CERT_SHA256"

          {
            echo "KEYSTORE_FILE=key.jks"
            echo "KEYSTORE_PASSWORD=$MANAGER_KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=${KEY_ALIAS}"
            echo "KEY_PASSWORD=$MANAGER_KEYSTORE_PASSWORD"
          } >> gradle.properties

      - name: Build custom manager APK
        working-directory: source/manager
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease -Pcommit="${RESUKISU_COMMIT}"

      - name: Keep only arm64 base APK
        run: |
          set -euo pipefail
          REL=source/manager/app/build/outputs/apk/release
          ARM64=$(find "$REL" -maxdepth 1 -type f -name '*arm64-v8a*release.apk' | head -n 1)
          test -n "$ARM64"
          mkdir -p source/manager/app/build/outputs/apk/custom
          cp "$ARM64" source/manager/app/build/outputs/apk/custom/custom-base.apk
          rm -f "$REL"/*.apk
          cp source/manager/app/build/outputs/apk/custom/custom-base.apk "$REL/custom-base.apk"

      - name: Fetch exact upstream ksud from matching commit
        run: |
          set -euo pipefail
          mkdir -p upstream-ksud
          curl -fL --retry 3             "https://nightly.link/ReSukiSU/ReSukiSU/actions/runs/${UPSTREAM_MANAGER_RUN}/ksud-aarch64-linux-android.zip"             -o upstream-ksud.zip
          unzip -o upstream-ksud.zip -d upstream-ksud >/dev/null
          KSUD=$(find upstream-ksud -type f -name 'ksud' | head -n 1)
          test -n "$KSUD"
          mkdir -p source/target/aarch64-linux-android/release
          cp "$KSUD" source/target/aarch64-linux-android/release/ksud

      - name: Repack with exact ksud and v2-sign
        working-directory: source
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MANAGER_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MANAGER_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          python3 repack_apk.py repack             -b release             -t release             -a arm64-v8a             -K manager/key.jks             -A "${KEY_ALIAS}"             -P "${KEYSTORE_PASSWORD}"             -S "${KEY_PASSWORD}"             -n ReSukiSU_v4.2.0-rc2_35154-custom             --no-strip

      - name: Verify package signature and identity
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MANAGER_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK=$(find source/dist -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"

          AAPT=$(find "${ANDROID_HOME}/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)
          test -x "$AAPT"
          test -x "$APKSIGNER"

          BADGING=$("$AAPT" dump badging "$APK")
          PKG=$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)
          LABEL=$(printf '%s\n' "$BADGING" | sed -n "s/^application-label:'\([^']*\)'.*/\1/p" | head -n 1)
          echo "package=$PKG"
          echo "label=$LABEL"
          test "$PKG" = "${CUSTOM_PACKAGE}"
          test "$LABEL" = "Daily Notes"

          # There must be no launcher entry in the final APK.
          if printf '%s\n' "$BADGING" | grep -q "^launchable-activity:"; then
            echo "Unexpected launcher activity remains"
            exit 1
          fi

          # Manifest-level visibility sanity checks.
          MANIFEST_DUMP=$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)
          ! printf '%s\n' "$MANIFEST_DUMP" | grep -q 'android.intent.category.LAUNCHER'
          ! printf '%s\n' "$MANIFEST_DUMP" | grep -q 'android.intent.action.MAIN'
          ! printf '%s\n' "$MANIFEST_DUMP" | grep -q 'android.intent.action.VIEW'
          ! printf '%s\n' "$MANIFEST_DUMP" | grep -q 'android.intent.action.SEND'
          echo "launcher_visibility=none"
          echo "ordinary_package_visibility=native_AppsFilter"

          # Public component identities must no longer expose ReSukiSU namespace.
          if printf '%s\n' "$MANIFEST_DUMP" | grep -Fq 'com.resukisu.resukisu'; then
            echo "Old ReSukiSU namespace remains in final manifest"
            exit 1
          fi
          if printf '%s\n' "$MANIFEST_DUMP" | grep -Eq 'MagicaService|WebUIActivity|DownloadService|MainActivity|KernelSUApplication'; then
            echo "Old public component names remain in final manifest"
            exit 1
          fi
          echo "public_component_namespace=relocated"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner-verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' apksigner-verify.txt

          keytool -exportcert             -alias "${KEY_ALIAS}"             -keystore source/manager/key.jks             -storepass "${KEYSTORE_PASSWORD}"             -file manager-cert.der >/dev/null

          CERT_SIZE=$(stat -c%s manager-cert.der)
          CERT_SHA256=$(sha256sum manager-cert.der | awk '{print $1}')
          test "$CERT_SIZE" = "$EXPECTED_MANAGER_CERT_SIZE"
          test "$CERT_SHA256" = "$EXPECTED_MANAGER_CERT_SHA256"
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          APK_SIZE=$(stat -c%s "$APK")

          mkdir -p custom-manager
          cp "$APK" custom-manager/ReSukiSU_v4.2.0-rc2_35154_com.daily.notes.apk
          cp apksigner-verify.txt custom-manager/
          cat > custom-manager/manager_identity.txt <<EOF
          source_commit=${RESUKISU_COMMIT}
          package=${CUSTOM_PACKAGE}
          apk_sha256=$APK_SHA256
          apk_size=$APK_SIZE
          cert_sha256=$CERT_SHA256
          cert_size=$CERT_SIZE
          signature_scheme=v2
          abi=arm64-v8a
          EOF
          cat custom-manager/manager_identity.txt

      - name: Upload custom manager
        uses: actions/upload-artifact@v7
        with:
          name: ReSukiSU-35154-com.daily.notes
          path: custom-manager/
          retention-days: 30
