name: Locate exact clang 14043575

on:
  push:
    branches:
      - resukisu-strict-manager
    paths:
      - '.github/workflows/Find-Clang14043575.yml'

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Search AOSP main-kernel-2025 history
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --single-branch \
            --branch main-kernel-2025 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 tc
          cd tc

          echo "HEAD=$(git rev-parse HEAD)"
          echo "Searching clang-r536225 BUILD_INFO history..."

          found=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            info=$(git show "$sha:clang-r536225/BUILD_INFO" 2>/dev/null || true)
            if printf '%s\n' "$info" | grep -Fq '14043575'; then
              echo "MATCH_COMMIT=$sha"
              git show -s --format='MATCH_DATE=%cI%nMATCH_SUBJECT=%s' "$sha"
              printf '%s\n' "$info" | sed -n '1,120p'
              found=1
            fi
          done < <(git log --format='%H' --all -- clang-r536225/BUILD_INFO)

          if [ "$found" -ne 1 ]; then
            echo "No BUILD_INFO commit containing 14043575 found in main-kernel-2025 path history."
            echo "Relevant history:"
            git log --date=iso-strict --format='%H %cI %s' --all -- clang-r536225/BUILD_INFO | head -100
            exit 1
          fi

      - name: Verify actual 14043575 clang binary
        run: |
          set -euo pipefail
          commit=9a98ca4072ec000f301bd3ece481ea2baca76ca5
          url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/$commit/clang-r536225.tar.gz"
          mkdir tc-bin
          curl --fail --location --retry 4 --retry-delay 3 "$url" --output clang-r536225.tar.gz
          tar -xzf clang-r536225.tar.gz -C tc-bin

          actual=$(tc-bin/bin/clang --version | head -n 1)
          expected='Android (14043575, +pgo, +bolt, +lto, +mlgo, based on r536225) clang version 19.0.1 (https://android.googlesource.com/toolchain/llvm-project b3a530ec6537146650e42be89f1089e9a3588460)'
          printf 'ACTUAL=%s\n' "$actual"
          printf 'EXPECTED=%s\n' "$expected"
          test "$actual" = "$expected"
          tc-bin/bin/ld.lld --version | grep -Fq 'LLD 19.0.1'
          echo "BINARY_PREFLIGHT=PASS"
