name: Daily Notes 2 official build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select Java 21 and install fixed Android platform
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Prepare pinned official sources and Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustup target add aarch64-linux-android
          sudo apt-get update -qq
          sudo apt-get install -y -qq libclang-18-dev
          mkdir -p .inputs
          git clone https://github.com/tiann/KernelSU.git .inputs/BackendSource
          git -C .inputs/BackendSource checkout 75e179d378d7aaa0de8946358a3384444c3e36b0
          git clone --branch gki-android16-6.12 https://gitlab.com/simonpunk/susfs4ksu.git .inputs/susfs4ksu
          git -C .inputs/susfs4ksu checkout 519c86c5d8ad3832ff4a2e1a81dc1b81076f1693
          CARGO_TARGET_DIR="$PWD/.inputs/literal-audit-target" cargo build --release --locked --manifest-path scripts/runtime-literal-audit/Cargo.toml
          cp manager-support/official-backend-branding.patch .inputs/expected-backend.patch
          python3 scripts/prepare_official_backend_branding.py
          cmp .inputs/expected-backend.patch manager-support/official-backend-branding.patch
          python3 scripts/check_module_directory_identity.py
      - name: Build fresh official backend and 519 filesystem tool
        run: |
          python3 scripts/build_official_backend.py > backend-build.log 2>&1 || { tail -100 backend-build.log; exit 1; }
          cp manager-artifacts/branded-official-backend/libnote_runtime.so manager/app/src/main/jniLibs/arm64-v8a/
          python3 scripts/build_official_fsctl.py
      - name: Test lint and assemble unsigned arm64 APK
        working-directory: manager
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease \
            --no-daemon --console=plain > ../manager-check.log 2>&1 || {
              tail -160 ../manager-check.log
              exit 1
            }
          tail -25 ../manager-check.log
      - name: Verify payload provenance and exact identity exceptions
        run: |
          python3 scripts/audit_manager_apk.py manager/app/build/outputs/apk/release/*-unsigned.apk \
            --output manager-artifacts/unsigned-identity-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DailyNotes-D2-unsigned-${{ github.run_number }}
          path: |
            manager-check.log
            backend-build.log
            manager-artifacts/*RECORD.json
            manager-artifacts/branded-official-backend/BUILD_RECORD.json
            manager-artifacts/unsigned-identity-audit.json
            manager/app/build/outputs/apk/release/*-unsigned.apk
            manager/app/build/test-results/testDebugUnitTest/TEST-*.xml
            manager/app/build/reports/lint-results-release.xml
          retention-days: 14
