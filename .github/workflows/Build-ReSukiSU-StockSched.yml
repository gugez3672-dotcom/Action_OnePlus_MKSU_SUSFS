name: Build PLK110 ReSukiSU + SUSFS (Stock Scheduler ABI)

on:
  workflow_dispatch:
  push:
    branches:
      - resukisu-strict-manager
    paths:
      - .github/plk110-resukisu-trigger

permissions:
  contents: read
  actions: read

concurrency:
  group: plk110-a67-resukisu-susfs-strict-manager
  cancel-in-progress: false

env:
  DEVICE: PLK110
  SOC: sm8850
  CODENAME: canoe
  ANDROID_VERSION: android16
  KERNEL_VERSION: "6.12"
  BUILD_VARIANT: perf
  BUILD_NUMBER: "14541642"
  FIRMWARE_BASELINE: PLK110_16.0.8.302(CN01)
  EXPECTED_KERNEL_RELEASE: 6.12.23-android16-5-gb2a876903b49-ab14541642-4k
  STOCK_CONFIG_SHA256: e239b50cb4c660493edfdc2ae4908b56cf5cae1e826f71f637da85e4aea3ecd0

  # Exact running A67 source set.
  MANIFEST_COMMIT: ecdd4809cbd01fa5f509a4708347026f63498303
  COMMON_COMMIT: b2a876903b495c444a94b16f50d1463ffe953957
  SOC_COMMIT: c88c1b3f75f7e88cd651608362ac7b95f11eb400
  MODULES_COMMIT: f45a4a587a0ba9107a5421a2dd978404f545164b

  # Pinned mature ReSukiSU / CCTV18 SUSFS integration.
  RESUKISU_COMMIT: 6ec8d9a8a8be30878c388504cacf8ae7849c757b
  SUSFS4OKI_COMMIT: 8dce4337bcd15807c5449bbeff6e02a967138db0
  CCTV18_REFERENCE_COMMIT: 2844bf492f557fb39113fc93a2dd1602e05790d7
  ANYKERNEL_COMMIT: 0fc7569866bb5d5fe51752cc410dca3e92ab332f

  VERIFIED_STOCK_RUN: "34980659033"
  VERIFIED_STOCK_COMMIT: 34e24abcfaac6fc9db1279ad073c15af216fd664
  REPO_LAUNCHER_SHA256: 1211b57b57e4122a9c546295a59b37d24068f1164d0e87bef096d5323c413e4f

  # A67 stock compiler identity captured from the running stock kernel config.
  AOSP_CLANG_PREBUILT_COMMIT: 9a98ca4072ec000f301bd3ece481ea2baca76ca5
  EXPECTED_CLANG_BUILD: "14043575"
  EXPECTED_LLVM_COMMIT: b3a530ec6537146650e42be89f1089e9a3588460

jobs:
  resukisu-stock-sched:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: Checkout build definition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify A67 baseline and scheduler invariants
        run: |
          set -euo pipefail
          mkdir -p artifacts
          echo "$STOCK_CONFIG_SHA256  baselines/PLK110_16.0.8.302_stock.config" | sha256sum --check
          stock=baselines/PLK110_16.0.8.302_stock.config
          grep -qx 'CONFIG_SCHED_CLASS_EXT=y' "$stock"
          grep -qx 'CONFIG_MODVERSIONS=y' "$stock"
          grep -qx 'CONFIG_MODULE_SIG=y' "$stock"
          grep -qx 'CONFIG_MODULE_SIG_ALL=y' "$stock"
          grep -qx 'CONFIG_MODULE_SIG_PROTECT=y' "$stock"
          grep -qx 'CONFIG_TRIM_UNUSED_KSYMS=y' "$stock"
          ! grep -Eq '^(CONFIG_(KSU|KPM|SUSFS)|# CONFIG_(KSU|KPM|SUSFS))' "$stock"

      - name: Confirm previously verified stock reproduction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             -H "Authorization: Bearer $GH_TOKEN"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_STOCK_RUN"             --output artifacts/VERIFIED_STOCK_RUN.json
          jq -e --arg sha "$VERIFIED_STOCK_COMMIT"             '.conclusion == "success" and .head_sha == $sha and .path == ".github/workflows/Build-Stock-A67.yml"'             artifacts/VERIFIED_STOCK_RUN.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils git curl jq python3 zip patch

          curl --fail --location --retry 3             https://storage.googleapis.com/git-repo-downloads/repo             --output /tmp/repo
          echo "$REPO_LAUNCHER_SHA256  /tmp/repo" | sha256sum --check
          sudo install -m 0755 /tmp/repo /usr/local/bin/repo

      - name: Sync and pin exact OnePlus A67 source
        run: |
          set -euo pipefail
          mkdir kernel_workspace
          cd kernel_workspace

          repo init             -u https://github.com/OnePlusOSS/kernel_manifest.git             -b "$MANIFEST_COMMIT"             -m oneplus_15.xml             --depth=1

          mkdir -p .repo/local_manifests
          printf '%s\n'             '<?xml version="1.0" encoding="UTF-8"?>'             '<manifest>'             '  <remove-project name="kernel_platform/prebuilts/asuite" />'             '  <remove-project name="kernel_platform/tools/tradefederation/prebuilts" />'             '</manifest>'             > .repo/local_manifests/prune-unused-test-prebuilts.xml

          repo sync -c --no-tags --no-clone-bundle -j2

          git -C kernel_platform/common fetch --depth=1 origin "$COMMON_COMMIT"
          git -C kernel_platform/common checkout --detach "$COMMON_COMMIT"
          git -C kernel_platform/soc-repo fetch --depth=1 origin "$SOC_COMMIT"
          git -C kernel_platform/soc-repo checkout --detach "$SOC_COMMIT"
          git fetch --depth=1 origin "$MODULES_COMMIT"
          git checkout --detach "$MODULES_COMMIT"

          test "$(git -C kernel_platform/common rev-parse HEAD)" = "$COMMON_COMMIT"
          test "$(git -C kernel_platform/soc-repo rev-parse HEAD)" = "$SOC_COMMIT"
          test "$(git rev-parse HEAD)" = "$MODULES_COMMIT"

          {
            echo "manifest=$MANIFEST_COMMIT"
            echo "common=$COMMON_COMMIT"
            echo "soc=$SOC_COMMIT"
            echo "modules=$MODULES_COMMIT"
            echo "cctv18_reference=$CCTV18_REFERENCE_COMMIT"
          } > "$GITHUB_WORKSPACE/artifacts/SOURCE_PINS.txt"

      - name: Restore exact A67 stock clang 14043575
        run: |
          set -euo pipefail
          dst="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86"
          tarball="$GITHUB_WORKSPACE/aosp-clang-r536225.tar.gz"
          url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/$AOSP_CLANG_PREBUILT_COMMIT/clang-r536225.tar.gz"

          test -d "$dst/clang-r536225"
          test -x "$dst/clang-r536225/bin/clang"
          "$dst/clang-r536225/bin/clang" --version | tee "$GITHUB_WORKSPACE/artifacts/CLANG_VERSION_BEFORE.txt"

          curl --fail --location --retry 4 --retry-delay 3 "$url" --output "$tarball"
          rm -rf "$dst/clang-r536225"
          mkdir -p "$dst/clang-r536225"
          tar -xzf "$tarball" -C "$dst/clang-r536225"

          CLANG="$dst/clang-r536225/bin/clang"
          LLD="$dst/clang-r536225/bin/ld.lld"
          test -x "$CLANG"
          test -x "$LLD"

          "$CLANG" --version | tee "$GITHUB_WORKSPACE/artifacts/CLANG_VERSION.txt"
          "$LLD" --version | tee "$GITHUB_WORKSPACE/artifacts/LLD_VERSION.txt"

          stock_cc=$(sed -n 's/^CONFIG_CC_VERSION_TEXT="\(.*\)"$/\1/p'             "$GITHUB_WORKSPACE/baselines/PLK110_16.0.8.302_stock.config")
          actual_cc=$("$CLANG" --version | head -n 1)
          test -n "$stock_cc"
          test "$actual_cc" = "$stock_cc"
          printf '%s\n' "$actual_cc" | grep -Fq "Android ($EXPECTED_CLANG_BUILD"
          printf '%s\n' "$actual_cc" | grep -Fq "based on r536225"
          printf '%s\n' "$actual_cc" | grep -Fq "clang version 19.0.1"
          printf '%s\n' "$actual_cc" | grep -Fq "$EXPECTED_LLVM_COMMIT"
          "$LLD" --version | grep -Fq "LLD 19.0.1"

          # The synced OnePlus prebuilt project itself stays in place; only the
          # clang-r536225 payload is replaced.
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          repo = Path("kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86")
          raw = subprocess.check_output(
              ["git", "-C", str(repo), "status", "--porcelain=v1", "-z"]
          ).decode(errors="replace")
          entries = [x for x in raw.split("\0") if x]
          bad = []
          for entry in entries:
              path = entry[3:] if len(entry) >= 4 else ""
              if " -> " in path:
                  path = path.split(" -> ", 1)[-1]
              if not path.startswith("clang-r536225/"):
                  bad.append(entry)
          if bad:
              raise SystemExit("unexpected prebuilt paths changed: " + repr(bad[:20]))
          PY

          {
            echo "aosp_clang_prebuilt_commit=$AOSP_CLANG_PREBUILT_COMMIT"
            echo "expected_android_build=$EXPECTED_CLANG_BUILD"
            echo "expected_llvm_commit=$EXPECTED_LLVM_COMMIT"
            echo "stock_cc=$stock_cc"
            sha256sum "$tarball" "$CLANG" "$LLD"
          } > "$GITHUB_WORKSPACE/artifacts/TOOLCHAIN_PROVENANCE.txt"

      - name: Apply only proven A67 stock build-system adaptations
        run: |
          set -euo pipefail
          common=kernel_workspace/kernel_platform/common
          kp=kernel_workspace/kernel_platform

          grep -Fq '"vmlinux_oki",' "$kp/build/kernel/kleaf/constants.bzl"
          ! grep -Fq '$(Q)cp $(objtree)/vmlinux $(objtree)/vmlinux_oki' "$common/scripts/Makefile.vmlinux"

          python3 - <<'PY'
          from pathlib import Path
          path = Path("kernel_workspace/kernel_platform/common/scripts/Makefile.vmlinux")
          text = path.read_text()
          anchor = (
              "vmlinux: scripts/link-vmlinux.sh vmlinux.o $(KBUILD_LDS) FORCE\n"
              "\t+$(call if_changed_dep,link_vmlinux)\n"
          )
          replacement = anchor + "\t$(Q)cp $(objtree)/vmlinux $(objtree)/vmlinux_oki\n"
          if text.count(anchor) != 1:
              raise SystemExit("unexpected A67 Makefile.vmlinux link rule")
          path.write_text(text.replace(anchor, replacement, 1))
          PY

          python3 - <<'PY'
          from pathlib import Path
          path = Path("kernel_workspace/kernel_platform/build/kernel/kleaf/impl/stamp.bzl")
          text = path.read_text()
          old = 'scmversion_prefix="-$android_release-$KMI_GENERATION-$oki_infix"'
          new = 'scmversion_prefix="-$android_release-$KMI_GENERATION"'
          if text.count(old) != 1:
              raise SystemExit("unexpected Kleaf scmversion_prefix composition")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Preserve original GKI module signer trust
        run: |
          set -euo pipefail
          git -C kernel_workspace/kernel_platform/common diff --exit-code -- BUILD.bazel
          python3 scripts/prepare_stock_trust.py

      - name: Integrate pinned ReSukiSU
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel_platform

          git clone --filter=blob:none --no-checkout             https://github.com/ReSukiSU/ReSukiSU.git KernelSU
          git -C KernelSU fetch origin "$RESUKISU_COMMIT"
          git -C KernelSU checkout --detach "$RESUKISU_COMMIT"
          test "$(git -C KernelSU rev-parse HEAD)" = "$RESUKISU_COMMIT"

          ln -sfn ../../KernelSU/kernel common/drivers/kernelsu
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' common/drivers/Makefile ||             printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> common/drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig ||             sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig

          grep -q 'config KSU_SUSFS' KernelSU/kernel/Kconfig
          grep -q 'REPO_NAME := ReSukiSU' KernelSU/kernel/Kbuild

      - name: Apply pinned CCTV18 SUSFS-for-OKI patch
        run: |
          set -euo pipefail
          cd kernel_workspace

          git clone --filter=blob:none --no-checkout --branch oki-android16-6.12             https://github.com/cctv18/susfs4oki.git susfs4ksu
          git -C susfs4ksu fetch origin "$SUSFS4OKI_COMMIT"
          git -C susfs4ksu checkout --detach "$SUSFS4OKI_COMMIT"
          test "$(git -C susfs4ksu rev-parse HEAD)" = "$SUSFS4OKI_COMMIT"

          cp susfs4ksu/kernel_patches/fs/* kernel_platform/common/fs/
          cp susfs4ksu/kernel_patches/include/linux/* kernel_platform/common/include/linux/
          cp             susfs4ksu/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch             kernel_platform/common/50_add_susfs.patch

          cd kernel_platform/common
          patch --dry-run -p1 -F 3 < 50_add_susfs.patch
          patch -p1 -F 3 < 50_add_susfs.patch
          test -z "$(find . -name '*.rej' -print -quit)"

          # CCTV18's patch currently contains two whitespace-only defects.
          # Normalize only those exact added lines; this does not change logic.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("fs/stat.c")
          lines = p.read_text().splitlines()
          for i, line in enumerate(lines):
              if "query_flags | AT_GETATTR_NOSEC);" in line and i and "request_mask," in lines[i - 1]:
                  lines[i] = "\t\t\t\t\t\tquery_flags | AT_GETATTR_NOSEC);"
          p.write_text("\n".join(lines) + "\n")

          p = Path("mm/memory.c")
          lines = [line.rstrip() for line in p.read_text().splitlines()]
          p.write_text("\n".join(lines) + "\n")
          PY

          git diff --check
          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
          grep -q '^#define SUSFS_VERSION' include/linux/susfs.h

      - name: Configure minimal ReSukiSU + SUSFS only
        run: |
          set -euo pipefail
          python3 scripts/prepare_resukisu_config.py
          git -C kernel_workspace/kernel_platform/KernelSU diff --check
          git -C kernel_workspace/kernel_platform/common diff --check

          # Deliberately exclude unrelated performance/network/scheduler changes.
          ! grep -Eq '^CONFIG_(KPM|MQ_IOSCHED_ADIOS|REKERNEL|BBG|TCP_CONG_BRUTAL)=y$'             baselines/PLK110_16.0.8.302_expected_resukisu_susfs.config.additions

          # Strict manager gate: fixed package + fixed private signer; no dynamic fallback.
          grep -qx '# CONFIG_KSU_MULTI_MANAGER_SUPPORT is not set' \
            baselines/PLK110_16.0.8.302_expected_resukisu_susfs.config.additions
          grep -Fq 'KSU_MANAGER_PACKAGE := com.daily.notes' \
            kernel_workspace/kernel_platform/KernelSU/kernel/Kbuild
          grep -Fq 'Daily Notes fixed signer' \
            kernel_workspace/kernel_platform/KernelSU/kernel/manager/apk_sign.c
          ! grep -Fq 'ksu_is_dynamic_manager_enabled()' \
            kernel_workspace/kernel_platform/KernelSU/kernel/manager/apk_sign.c
          grep -Fq '{ 890, "7b6fcd9e7f440833ee8a5a3860f3ff5b7b367a0dabb36c1d5f0fd52064bf283e" }' \
            kernel_workspace/kernel_platform/KernelSU/kernel/manager/apk_sign.c
          ! grep -Fq 'KSU_MANAGER_APK_SHA256' \
            kernel_workspace/kernel_platform/KernelSU/kernel/Kbuild
          ! grep -Fq 'check_apk_file_sha256' \
            kernel_workspace/kernel_platform/KernelSU/kernel/manager/apk_sign.c
          grep -Fq 'if (ksu_get_uid_t(current_uid()) != 0 && !is_manager())' \
            kernel_workspace/kernel_platform/KernelSU/kernel/supercall/supercall.c
          python3 - <<'PY'
          from pathlib import Path
          p = Path('kernel_workspace/kernel_platform/KernelSU/kernel/supercall/dispatch.c').read_text()
          for marker in (
              '.cmd = KSU_IOCTL_GET_INFO,',
              '.cmd = KSU_IOCTL_GET_INFO_LEGACY,',
              '.cmd = KSU_IOCTL_CHECK_SAFEMODE,',
              '.cmd = KSU_IOCTL_GET_FULL_VERSION,',
          ):
              start = p.index(marker)
              end = p.index('    },', start)
              block = p[start:end]
              assert '.perm_check = manager_or_root' in block, marker
              assert '.perm_check = always_allow' not in block, marker
          PY

      - name: Record source and patch state
        run: |
          set -euo pipefail
          common=kernel_workspace/kernel_platform/common
          git -C "$common" diff --exit-code -- arch/arm64/configs/gki_defconfig build.config.gki
          cp "$common/arch/arm64/configs/gki_defconfig" artifacts/upstream_gki_defconfig
          cp "$common/arch/arm64/configs/plk110_stock.fragment" artifacts/
          cp "$common/arch/arm64/configs/plk110_resukisu.fragment" artifacts/
          cp "$common/certs/plk110_stock.pem" artifacts/
          git -C "$common" diff > artifacts/COMMON_BUILD_ADAPTATIONS.patch
          git -C kernel_workspace/kernel_platform/KernelSU diff > artifacts/RESUKISU_KLEAF_ADAPTATION.patch
          git -C kernel_workspace diff -- kernel_platform/build/kernel/kleaf/impl/stamp.bzl > artifacts/KLEAF_STAMP_ADAPTATION.patch
          tar -czf artifacts/SUSFS4OKI_ADDED_SOURCES.tar.gz             -C kernel_workspace/susfs4ksu kernel_patches/fs kernel_patches/include/linux

          printf 'resukisu=%s\nsusfs4oki=%s\n' "$RESUKISU_COMMIT" "$SUSFS4OKI_COMMIT"             >> artifacts/SOURCE_PINS.txt

          git -C "$common" diff --name-only -z | xargs -0 -r git -C "$common" update-index --assume-unchanged
          test -z "$(git -C "$common" status -uno --porcelain)"
          (cd kernel_workspace && repo manifest -r) > artifacts/SOURCE_MANIFEST.xml

      - name: Preflight exact stock config plus declared root delta
        run: |
          set -euo pipefail
          bash scripts/build_gki.sh preflight
          python3 scripts/verify_gki.py             --preflight             --additions baselines/PLK110_16.0.8.302_expected_resukisu_susfs.config.additions

      - name: Build exact A67 GKI
        run: bash scripts/build_gki.sh build

      - name: Verify Image config, stock module CRCs and signer trust
        run: |
          set -euo pipefail
          python3 scripts/verify_gki.py             --additions baselines/PLK110_16.0.8.302_expected_resukisu_susfs.config.additions

      - name: Verify ReSukiSU and SUSFS compiled
        run: |
          set -euo pipefail
          grep -Eq ' [Tt] kernelsu_init$' artifacts/System.map
          grep -Eq ' [Tt] susfs_init$' artifacts/System.map
          python3 - <<'PY'
          from pathlib import Path
          image = Path('artifacts/Image').read_bytes()
          assert b'ReSukiSU-6ec8d9a8@PLK110-A67' in image, 'wrong ReSukiSU version metadata'
          assert b'SUSFS' in image or b'susfs' in image, 'SUSFS metadata/string not found'
          assert b'com.daily.notes' in image, 'strict manager package not embedded'
          assert b'7b6fcd9e7f440833ee8a5a3860f3ff5b7b367a0dabb36c1d5f0fd52064bf283e' in image, 'fixed Daily Notes certificate hash missing'
          assert b'06de283eff2a368fa627b9cc10a1c313ec752d05f16184d4764a6b09c4854df9' not in image, 'old Daily Notes certificate hash still present'
          assert b'346f9be72eca3a574986ddf0ee40294ede2c6146d024d1c44e8e860d4d5a6fd2' not in image, 'old exact APK hash gate still present'
          assert b'9e6da35ae18f9721e5d82a58d6f162cb9ff30921152f8194456b5c56b0f2e6c4' not in image, 'new APK hash must not be embedded in durable gate'
          for forbidden in (
              b'74b8819b440c3ca3e1df33e49bff33e0115aab37271eec2c1e85e407c4a5d3a3',
              b'd3469712b6214462764a1d8d3e5cbe1d6819a0b629791b9f4101867821f1df64',
              b'c371061b19d8c7d7d6133c6a9bafe198fa944e50c1b31c9d8daa8d7f1fc2d2d6',
              b'7e0c6d7278a3bb8e364e0fcba95afaf3666cf5ff3c245a3b63c8833bd0445cc4',
              b'f415f4ed9435427e1fdf7f1fccd4dbc07b3d6b8751e4dbcec6f19671f427870b',
              b'947ae944f3de4ed4c21a7e4f7953ecf351bfa2b36239da37a34111ad29993eef',
              b'484fcba6e6c43b1fb09700633bf2fb4758f13cb0b2f4457b80d075084b26c588',
          ):
              assert forbidden not in image, f'forbidden manager certificate hash present: {forbidden.decode()}'
          PY

      - name: Gate stock scheduler and Oplus vendor-module compatibility
        run: |
          set -euo pipefail
          grep -qx 'CONFIG_SCHED_CLASS_EXT=y' artifacts/image.config
          grep -qx 'CONFIG_MODVERSIONS=y' artifacts/image.config
          grep -qx '# CONFIG_KSU_MULTI_MANAGER_SUPPORT is not set' artifacts/image.config
          stock_cc=$(grep '^CONFIG_CC_VERSION_TEXT=' baselines/PLK110_16.0.8.302_stock.config)
          image_cc=$(grep '^CONFIG_CC_VERSION_TEXT=' artifacts/image.config)
          test "$image_cc" = "$stock_cc"
          printf '%s\n' "$image_cc" | grep -Fq 'Android (14043575'
          grep -Eq '__trace(iter|point)_android_vh_scx_restore_flags' artifacts/Module.symvers

          python3 - <<'PY'
          import json
          from pathlib import Path
          verdict = json.loads(Path('artifacts/VERDICT.json').read_text())
          abi = verdict['module_abi']
          assert verdict['passed'] is True
          assert abi['missing'] == []
          assert abi['crc_mismatches'] == {}
          Path('artifacts/STOCK_SCHEDULER_ABI_GATE.txt').write_text(
              'PASS\n'
              f"stock vendor modules captured: {abi['phone_module_count']}\n"
              f"matched kernel symbol CRCs: {abi['matched']}\n"
              f"resolved by existing modules: {abi['resolved_by_existing_modules']}\n"
              'CONFIG_SCHED_CLASS_EXT=y preserved\n'
              'android_vh_scx_restore_flags ABI preserved\n'
          )
          PY

      - name: Package verified Image only
        run: bash scripts/package_resukisu_gki.sh

      - name: Generate checksums
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts
          (
            cd artifacts
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0               | sort -z               | xargs -0 -r sha256sum               > SHA256SUMS.txt
          )

      - name: Upload diagnostics and verified package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PLK110-A67-ReSukiSU-SUSFS-StrictManager-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
