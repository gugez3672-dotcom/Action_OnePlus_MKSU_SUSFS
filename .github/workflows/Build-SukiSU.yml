name: Build PLK110 SukiSU 4.2 + SUSFS 2.3

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plk110-susfs-build
  cancel-in-progress: false

env:
  DEVICE: PLK110
  SOC: sm8850
  CODENAME: canoe
  ANDROID_VERSION: android16
  KERNEL_VERSION: "6.12"
  BUILD_METHOD: gki
  FIRMWARE_BASELINE: PLK110_16.0.8.302(CN01)
  EXPECTED_KERNEL_RELEASE: 6.12.23-android16-5-gb2a876903b49-ab14541642-4k
  STOCK_CONFIG_SHA256: e239b50cb4c660493edfdc2ae4908b56cf5cae1e826f71f637da85e4aea3ecd0
  A67_SELINUX_PATCH_SHA256: 101d7bce48d848495ae4d972347bfd60cd78f45dcc9bb4f6780162612c51f97c

  # Exact running A.67 GKI commit plus the official A.67 OnePlus SoC/modules
  # snapshots. The public manifest is branch-based, so all three are checked
  # out to immutable commits below.
  MANIFEST_COMMIT: ecdd4809cbd01fa5f509a4708347026f63498303
  COMMON_COMMIT: b2a876903b495c444a94b16f50d1463ffe953957
  SOC_COMMIT: c88c1b3f75f7e88cd651608362ac7b95f11eb400
  MODULES_COMMIT: f45a4a587a0ba9107a5421a2dd978404f545164b

  # SukiSU's builtin branch contains the SUSFS-side SukiSU integration.
  SUKISU_COMMIT: e2912817f4e1b194e582a06e0b5eacf6a3fb7083
  SUSFS_COMMIT: c7db8cb367ef3ed4126ed7e222d77757ccb5c05b
  ANYKERNEL_COMMIT: 0fc7569866bb5d5fe51752cc410dca3e92ab332f

  SUSFS_MODULE_URL: https://github.com/sidex15/susfs4ksu-module/releases/download/v1.5.2%2B_R28/ksu_module_susfs_1.5.2%2B.zip
  SUSFS_MODULE_SHA256: abcd6bf456ea8189298d9e496faa440201d90e4f0bd93b83c0527589001c9376
  REPO_LAUNCHER_SHA256: 1211b57b57e4122a9c546295a59b37d24068f1164d0e87bef096d5323c413e4f

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: Checkout audited build definition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify checked-in baseline and adaptation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "$STOCK_CONFIG_SHA256  baselines/PLK110_16.0.8.302_stock.config" | sha256sum --check
          echo "$A67_SELINUX_PATCH_SHA256  patches/PLK110_A67_susfs_selinux_hooks.patch" | sha256sum --check

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils git curl jq python3 zip

          curl --fail --location --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output /tmp/repo
          echo "$REPO_LAUNCHER_SHA256  /tmp/repo" | sha256sum --check
          sudo install -m 0755 /tmp/repo /usr/local/bin/repo

      - name: Sync and pin OnePlus source
        run: |
          set -euo pipefail
          mkdir kernel_workspace
          cd kernel_workspace

          repo init \
            -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b "$MANIFEST_COMMIT" \
            -m oneplus_15.xml \
            --depth=1

          # These are Android test-suite prebuilts, not kernel build inputs.
          # Their CodeLinaro branch was removed after OnePlus published the
          # manifest, so keeping them makes an otherwise valid source sync fail.
          mkdir -p .repo/local_manifests
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<manifest>' \
            '  <remove-project name="kernel_platform/prebuilts/asuite" />' \
            '  <remove-project name="kernel_platform/tools/tradefederation/prebuilts" />' \
            '</manifest>' \
            > .repo/local_manifests/prune-unused-test-prebuilts.xml

          repo sync -c --no-tags --no-clone-bundle -j2

          git -C kernel_platform/common fetch --depth=1 origin "$COMMON_COMMIT"
          git -C kernel_platform/common checkout --detach "$COMMON_COMMIT"
          git -C kernel_platform/soc-repo fetch --depth=1 origin "$SOC_COMMIT"
          git -C kernel_platform/soc-repo checkout --detach "$SOC_COMMIT"
          git fetch --depth=1 origin "$MODULES_COMMIT"
          git checkout --detach "$MODULES_COMMIT"

          test "$(git -C kernel_platform/common rev-parse HEAD)" = "$COMMON_COMMIT"
          test "$(git -C kernel_platform/soc-repo rev-parse HEAD)" = "$SOC_COMMIT"
          test "$(git rev-parse HEAD)" = "$MODULES_COMMIT"

      - name: Integrate pinned SukiSU builtin
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel_platform

          git clone --filter=blob:none --no-checkout --depth=1 --branch builtin \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          git -C KernelSU fetch --depth=1 origin "$SUKISU_COMMIT"
          git -C KernelSU checkout --detach "$SUKISU_COMMIT"
          test "$(git -C KernelSU rev-parse HEAD)" = "$SUKISU_COMMIT"

          ln -sfn ../../KernelSU/kernel common/drivers/kernelsu
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' common/drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> common/drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig || \
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig

          grep -q 'config KSU_SUSFS' KernelSU/kernel/Kconfig
          grep -q 'susfs_init();' KernelSU/kernel/ksu.c

      - name: Apply pinned SUSFS kernel patch
        run: |
          set -euo pipefail
          cd kernel_workspace

          git clone --filter=blob:none --no-checkout --depth=1 --branch gki-android16-6.12 \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          git -C susfs4ksu fetch --depth=1 origin "$SUSFS_COMMIT"
          git -C susfs4ksu checkout --detach "$SUSFS_COMMIT"
          test "$(git -C susfs4ksu rev-parse HEAD)" = "$SUSFS_COMMIT"

          cp susfs4ksu/kernel_patches/fs/* kernel_platform/common/fs/
          cp susfs4ksu/kernel_patches/include/linux/* kernel_platform/common/include/linux/
          cp \
            susfs4ksu/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch \
            kernel_platform/common/50_add_susfs.patch

          cd kernel_platform/common
          # OnePlus A.67 has a different comment block immediately after
          # selinux_state. Apply the upstream SUSFS patch everywhere else,
          # then use the audited A.67-only hooks.c context adaptation.
          git apply --check --exclude=security/selinux/hooks.c 50_add_susfs.patch
          git apply --exclude=security/selinux/hooks.c 50_add_susfs.patch
          git apply --check "$GITHUB_WORKSPACE/patches/PLK110_A67_susfs_selinux_hooks.patch"
          git apply "$GITHUB_WORKSPACE/patches/PLK110_A67_susfs_selinux_hooks.patch"

          grep -q '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h
          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile

      - name: Configure minimal full SUSFS build
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel_platform
          config=common/arch/arm64/configs/gki_defconfig

          set_config() {
            symbol="$1"
            value="$2"
            sed -i -E "/^(# )?CONFIG_${symbol}(=| is not set)/d" "$config"
            if [ "$value" = y ]; then
              printf 'CONFIG_%s=y\n' "$symbol" >> "$config"
            else
              printf '# CONFIG_%s is not set\n' "$symbol" >> "$config"
            fi
          }

          set_config KSU y
          set_config KSU_FEATURE_ADBROOT n
          set_config KSU_DEBUG n
          set_config KPM n
          set_config KSU_SUSFS y
          set_config KSU_SUSFS_SUS_PATH y
          set_config KSU_SUSFS_SUS_MOUNT y
          set_config KSU_SUSFS_SUS_KSTAT y
          set_config KSU_SUSFS_SPOOF_UNAME y
          set_config KSU_SUSFS_ENABLE_LOG n
          set_config KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y
          set_config KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG y
          set_config KSU_SUSFS_OPEN_REDIRECT y
          set_config KSU_SUSFS_SUS_MAP y
          set_config LTO_NONE y
          set_config LTO_CLANG n
          set_config LTO_CLANG_FULL n
          set_config LTO_CLANG_THIN n

          for build_file in common/BUILD.bazel msm-kernel/BUILD.bazel; do
            if [ -f "$build_file" ]; then
              sed -i '/"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",/d' "$build_file"
            fi
          done
          rm -f common/android/abi_gki_protected_exports_*
          rm -f msm-kernel/android/abi_gki_protected_exports_*
          sed -i 's/check_defconfig//g' common/build.config.gki

          # Keep the device's g188c695beb6d base identifier without a -dirty
          # suffix after applying the audited local patches.
          sed -i "s/printf '%s' -dirty/: # reproducible patched tree/" common/scripts/setlocalversion

      - name: Build kernel
        run: |
          set -euo pipefail
          cd kernel_workspace
          LTO=none \
          SYSTEM_DLKM_RE_SIGN=0 \
          BUILD_SYSTEM_DLKM=0 \
          KMI_SYMBOL_LIST_STRICT_MODE=0 \
            ./kernel_platform/oplus/build/oplus_build_kernel.sh "$CODENAME" "$BUILD_METHOD"

      - name: Verify effective kernel configuration
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel_platform

          effective_config="$(find out -type f -path '*/common/.config' -print -quit)"
          test -n "$effective_config"

          stock_config="$GITHUB_WORKSPACE/baselines/PLK110_16.0.8.302_stock.config"
          echo "$STOCK_CONFIG_SHA256  $stock_config" | sha256sum --check

          for symbol in \
            CONFIG_KSU \
            CONFIG_KSU_SUSFS \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_SPOOF_UNAME \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            CONFIG_KSU_SUSFS_SUS_MAP; do
            grep -qx "${symbol}=y" "$effective_config"
          done

          ! grep -qx 'CONFIG_KPM=y' "$effective_config"
          ! grep -qx 'CONFIG_KSU_DEBUG=y' "$effective_config"
          ! grep -qx 'CONFIG_KSU_SUSFS_ENABLE_LOG=y' "$effective_config"
          grep -qx 'CONFIG_LTO_NONE=y' "$effective_config"
          ! grep -qx 'CONFIG_LTO_CLANG=y' "$effective_config"

          # A full diff is retained for review. Changes to scheduling, CPU
          # frequency/idle, ZRAM, LTO/CFI, module ABI/signing, preemption or
          # debug hardening are fatal: this kernel is an A.67 stock-behaviour
          # baseline with only SukiSU/SUSFS integration.
          grep -E '^(CONFIG_|# CONFIG_.* is not set)' "$stock_config" | sort > /tmp/stock.config.sorted
          grep -E '^(CONFIG_|# CONFIG_.* is not set)' "$effective_config" | sort > /tmp/effective.config.sorted
          diff -u /tmp/stock.config.sorted /tmp/effective.config.sorted > "$GITHUB_WORKSPACE/kernel_config_delta.txt" || true

          sensitive='^(# )?CONFIG_(PREEMPT|PREEMPTION|HZ|HZ_|SCHED|SCHED_|UCLAMP|WALT|HMBIRD|SLIM_SCHED|EXT_GROUP_SCHED|CPU_FREQ|CPU_FREQ_|CPU_IDLE|CPU_IDLE_|ZRAM|ZSMALLOC|LTO|LTO_|CFI|CFI_|MODVERSIONS|MODULE_SIG|MODULE_SIG_|KASAN|KASAN_|DEBUG_KERNEL)(=| is not set)'
          grep -E "$sensitive" "$stock_config" | sort > /tmp/stock.sensitive
          grep -E "$sensitive" "$effective_config" | sort > /tmp/effective.sensitive
          diff -u /tmp/stock.sensitive /tmp/effective.sensitive

          cp "$effective_config" "$GITHUB_WORKSPACE/effective_kernel_config.txt"
          cp "$stock_config" "$GITHUB_WORKSPACE/stock_kernel_config.txt"

      - name: Package kernel and stable userspace module separately
        run: |
          set -euo pipefail

          dist=kernel_workspace/kernel_platform/out/msm-kernel-canoe-gki/dist
          image="$dist/Image"
          if [ ! -s "$image" ]; then
            image="$(find kernel_workspace/kernel_platform/out -type f -name Image -print -quit)"
          fi
          test -n "$image"
          test -s "$image"

          strings "$image" > /tmp/plk110-image.strings
          kernel_banner="$(grep -m1 '^Linux version ' /tmp/plk110-image.strings)"
          test -n "$kernel_banner"
          printf '%s\n' "$kernel_banner" | grep -F "$EXPECTED_KERNEL_RELEASE"
          ! printf '%s\n' "$kernel_banner" | grep -F -- '-dirty'

          git clone --filter=blob:none --no-checkout --depth=1 --branch master \
            https://github.com/Numbersf/AnyKernel3.git AnyKernel3
          git -C AnyKernel3 fetch --depth=1 origin "$ANYKERNEL_COMMIT"
          git -C AnyKernel3 checkout --detach "$ANYKERNEL_COMMIT"
          test "$(git -C AnyKernel3 rev-parse HEAD)" = "$ANYKERNEL_COMMIT"
          rm -rf AnyKernel3/.git

          cp "$image" AnyKernel3/Image
          sed -i 's/^kernel.string=.*/kernel.string=PLK110 SukiSU 4.2 + SUSFS 2.3/' AnyKernel3/anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=1/' AnyKernel3/anykernel.sh
          sed -i 's/^device.name1=.*/device.name1=PLK110/' AnyKernel3/anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=OP60FFL1/' AnyKernel3/anykernel.sh

          mkdir artifacts
          (
            cd AnyKernel3
            zip -r9 ../artifacts/PLK110_SukiSU-4.2_SUSFS-2.3_NoKPM.zip .
          )

          curl --fail --location --retry 3 \
            "$SUSFS_MODULE_URL" \
            --output artifacts/ksu_module_susfs_1.5.2+_R28.zip
          echo "$SUSFS_MODULE_SHA256  artifacts/ksu_module_susfs_1.5.2+_R28.zip" | sha256sum --check

          image_sha="$(sha256sum "$image" | awk '{print $1}')"
          kernel_zip_sha="$(sha256sum artifacts/PLK110_SukiSU-4.2_SUSFS-2.3_NoKPM.zip | awk '{print $1}')"
          module_sha="$(sha256sum artifacts/ksu_module_susfs_1.5.2+_R28.zip | awk '{print $1}')"

          {
            echo "device=$DEVICE"
            echo "firmware_baseline=$FIRMWARE_BASELINE"
            echo "expected_kernel_release=$EXPECTED_KERNEL_RELEASE"
            echo "manifest=$MANIFEST_COMMIT"
            echo "common=$COMMON_COMMIT"
            echo "soc=$SOC_COMMIT"
            echo "modules=$MODULES_COMMIT"
            echo "sukisu=$SUKISU_COMMIT"
            echo "susfs=$SUSFS_COMMIT"
            echo "anykernel=$ANYKERNEL_COMMIT"
            echo "kpm=disabled"
            echo "susfs_log=disabled"
            echo "image_sha256=$image_sha"
            echo "kernel_zip_sha256=$kernel_zip_sha"
            echo "module_sha256=$module_sha"
          } > artifacts/BUILD_INFO.txt

          cp "$image" artifacts/Image
          cp effective_kernel_config.txt artifacts/
          cp stock_kernel_config.txt artifacts/
          cp kernel_config_delta.txt artifacts/
          printf '%s\n' "$kernel_banner" > artifacts/KERNEL_BANNER.txt
          (
            cd artifacts
            sha256sum \
              BUILD_INFO.txt \
              Image \
              KERNEL_BANNER.txt \
              PLK110_SukiSU-4.2_SUSFS-2.3_NoKPM.zip \
              effective_kernel_config.txt \
              kernel_config_delta.txt \
              ksu_module_susfs_1.5.2+_R28.zip \
              stock_kernel_config.txt \
              > SHA256SUMS.txt
          )

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PLK110-SukiSU-4.2-SUSFS-2.3-verified
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
