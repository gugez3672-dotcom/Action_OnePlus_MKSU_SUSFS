name: Build PLK110 SukiSU 4.2 + SUSFS 2.3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/plk110-build-trigger

permissions:
  contents: read

concurrency:
  group: plk110-a67-sukisu-susfs
  cancel-in-progress: false

env:
  DEVICE: PLK110
  SOC: sm8850
  CODENAME: canoe
  ANDROID_VERSION: android16
  KERNEL_VERSION: "6.12"
  BUILD_VARIANT: perf
  BUILD_NUMBER: "14541642"
  FIRMWARE_BASELINE: PLK110_16.0.8.302(CN01)
  EXPECTED_KERNEL_RELEASE: 6.12.23-android16-5-gb2a876903b49-ab14541642-4k
  STOCK_CONFIG_SHA256: e239b50cb4c660493edfdc2ae4908b56cf5cae1e826f71f637da85e4aea3ecd0

  # Exact commits previously identified from the running A.67 kernel/source set.
  MANIFEST_COMMIT: ecdd4809cbd01fa5f509a4708347026f63498303
  COMMON_COMMIT: b2a876903b495c444a94b16f50d1463ffe953957
  SOC_COMMIT: c88c1b3f75f7e88cd651608362ac7b95f11eb400
  MODULES_COMMIT: f45a4a587a0ba9107a5421a2dd978404f545164b

  SUKISU_COMMIT: e2912817f4e1b194e582a06e0b5eacf6a3fb7083
  SUSFS_COMMIT: c7db8cb367ef3ed4126ed7e222d77757ccb5c05b
  ANYKERNEL_COMMIT: 0fc7569866bb5d5fe51752cc410dca3e92ab332f
  EXPECTED_CONFIG_ADDITIONS_SHA256: d3235c8aa6e95b7b56c24a4619f01d930ffbac48a050d593fdcf896f770a997e
  A67_SELINUX_PATCH_SHA256: 101d7bce48d848495ae4d972347bfd60cd78f45dcc9bb4f6780162612c51f97c
  SUKISU_COMPAT_PATCH_SHA256: ea2be02443d0d5aed8da7866071af33bfc89a3f394d905b2db49798e6c574444
  VERIFIED_STOCK_RUN: "34980659033"
  VERIFIED_STOCK_COMMIT: 34e24abcfaac6fc9db1279ad073c15af216fd664

  REPO_LAUNCHER_SHA256: 1211b57b57e4122a9c546295a59b37d24068f1164d0e87bef096d5323c413e4f

jobs:
  sukisu-gki:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: Checkout audited reproduction definition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify stock baseline
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "$STOCK_CONFIG_SHA256  baselines/PLK110_16.0.8.302_stock.config" | sha256sum --check

          stock=baselines/PLK110_16.0.8.302_stock.config
          ! grep -Eq '^(CONFIG_(KSU|KPM|SUSFS)|# CONFIG_(KSU|KPM|SUSFS))' "$stock"
          grep -qx 'CONFIG_LTO_NONE=y' "$stock"
          grep -qx 'CONFIG_MODVERSIONS=y' "$stock"
          grep -qx 'CONFIG_MODULE_SIG=y' "$stock"
          grep -qx 'CONFIG_MODULE_SIG_ALL=y' "$stock"
          grep -qx 'CONFIG_MODULE_SIG_PROTECT=y' "$stock"
          grep -qx 'CONFIG_TRIM_UNUSED_KSYMS=y' "$stock"

      - name: Require completed stock verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_STOCK_RUN" \
            --output artifacts/VERIFIED_STOCK_RUN.json
          jq -e --arg sha "$VERIFIED_STOCK_COMMIT" \
            '.conclusion == "success" and .head_sha == $sha and .path == ".github/workflows/Build-Stock-A67.yml"' \
            artifacts/VERIFIED_STOCK_RUN.json
          echo "$EXPECTED_CONFIG_ADDITIONS_SHA256  baselines/PLK110_16.0.8.302_expected_sukisu_susfs.config.additions" | sha256sum --check
          echo "$A67_SELINUX_PATCH_SHA256  patches/PLK110_A67_susfs_selinux_hooks.patch" | sha256sum --check
          echo "$SUKISU_COMPAT_PATCH_SHA256  patches/PLK110_SukiSU_4.2_6.12_compat.patch" | sha256sum --check

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils git curl jq python3 zip

          curl --fail --location --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output /tmp/repo
          echo "$REPO_LAUNCHER_SHA256  /tmp/repo" | sha256sum --check
          sudo install -m 0755 /tmp/repo /usr/local/bin/repo

      - name: Sync and pin OnePlus A.67 source
        run: |
          set -euo pipefail
          mkdir kernel_workspace
          cd kernel_workspace

          repo init \
            -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b "$MANIFEST_COMMIT" \
            -m oneplus_15.xml \
            --depth=1

          # Removed upstream test prebuilts are not kernel build inputs.
          mkdir -p .repo/local_manifests
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<manifest>' \
            '  <remove-project name="kernel_platform/prebuilts/asuite" />' \
            '  <remove-project name="kernel_platform/tools/tradefederation/prebuilts" />' \
            '</manifest>' \
            > .repo/local_manifests/prune-unused-test-prebuilts.xml

          repo sync -c --no-tags --no-clone-bundle -j2

          git -C kernel_platform/common fetch --depth=1 origin "$COMMON_COMMIT"
          git -C kernel_platform/common checkout --detach "$COMMON_COMMIT"
          git -C kernel_platform/soc-repo fetch --depth=1 origin "$SOC_COMMIT"
          git -C kernel_platform/soc-repo checkout --detach "$SOC_COMMIT"
          git fetch --depth=1 origin "$MODULES_COMMIT"
          git checkout --detach "$MODULES_COMMIT"

          test "$(git -C kernel_platform/common rev-parse HEAD)" = "$COMMON_COMMIT"
          test "$(git -C kernel_platform/soc-repo rev-parse HEAD)" = "$SOC_COMMIT"
          test "$(git rev-parse HEAD)" = "$MODULES_COMMIT"

          {
            echo "manifest=$MANIFEST_COMMIT"
            echo "common=$COMMON_COMMIT"
            echo "soc=$SOC_COMMIT"
            echo "modules=$MODULES_COMMIT"
          } > "$GITHUB_WORKSPACE/artifacts/SOURCE_PINS.txt"

      - name: Apply only required stock build-system adaptations
        run: |
          set -euo pipefail
          common=kernel_workspace/kernel_platform/common
          kp=kernel_workspace/kernel_platform

          # The pinned A.67 common commit predates the later official one-line
          # vmlinux_oki copy while this pinned Kleaf snapshot already requires
          # vmlinux_oki as a GKI output. This changes only the copied build
          # artifact, not the linked vmlinux contents.
          grep -Fq '"vmlinux_oki",' "$kp/build/kernel/kleaf/constants.bzl"
          ! grep -Fq '$(Q)cp $(objtree)/vmlinux $(objtree)/vmlinux_oki' "$common/scripts/Makefile.vmlinux"

          python3 - <<'PY'
          from pathlib import Path
          path = Path("kernel_workspace/kernel_platform/common/scripts/Makefile.vmlinux")
          text = path.read_text()
          anchor = (
              "vmlinux: scripts/link-vmlinux.sh vmlinux.o $(KBUILD_LDS) FORCE\n"
              "\t+$(call if_changed_dep,link_vmlinux)\n"
          )
          replacement = anchor + "\t$(Q)cp $(objtree)/vmlinux $(objtree)/vmlinux_oki\n"
          if text.count(anchor) != 1:
              raise SystemExit("unexpected A.67 Makefile.vmlinux link rule")
          path.write_text(text.replace(anchor, replacement, 1))
          PY

          # The running PLK110 A.67 release has no Kleaf OKI '-o-' component.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("kernel_workspace/kernel_platform/build/kernel/kleaf/impl/stamp.bzl")
          text = path.read_text()
          old = 'scmversion_prefix="-$android_release-$KMI_GENERATION-$oki_infix"'
          new = 'scmversion_prefix="-$android_release-$KMI_GENERATION"'
          if text.count(old) != 1:
              raise SystemExit("unexpected Kleaf scmversion_prefix composition")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Preserve original GKI module signer trust
        run: |
          set -euo pipefail
          git -C kernel_workspace/kernel_platform/common diff --exit-code -- BUILD.bazel
          python3 scripts/prepare_stock_trust.py

      - name: Integrate pinned SukiSU builtin
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel_platform

          git clone --filter=blob:none --no-checkout --depth=1 --branch builtin \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          git -C KernelSU fetch --depth=1 origin "$SUKISU_COMMIT"
          git -C KernelSU checkout --detach "$SUKISU_COMMIT"
          test "$(git -C KernelSU rev-parse HEAD)" = "$SUKISU_COMMIT"

          ln -sfn ../../KernelSU/kernel common/drivers/kernelsu
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' common/drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> common/drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig || \
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' common/drivers/Kconfig

          grep -q 'config KSU_SUSFS' KernelSU/kernel/Kconfig
          grep -q 'susfs_init();' KernelSU/kernel/ksu.c

      - name: Apply SukiSU 4.2 Android 6.12 compatibility patch
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/patches/PLK110_SukiSU_4.2_6.12_compat.patch"
          echo "$SUKISU_COMPAT_PATCH_SHA256  $patch" | sha256sum --check

          cd kernel_workspace/kernel_platform/KernelSU
          git apply --check "$patch"
          git apply "$patch"
          git diff --check

          grep -Fq 'static int kernel_umount_feature_set(u64 value)' kernel/feature/kernel_umount.c
          grep -Fq '.id = LSM_ID_UNDEF,' kernel/hook/lsm_hook.c
          grep -Fq 'security_add_hooks(ksu_hooks, ARRAY_SIZE(ksu_hooks), &ksu_lsmid);' kernel/hook/lsm_hook.c
          grep -Fq '#define LSM_ID_UNDEF' ../common/include/uapi/linux/lsm.h
          grep -Fq 'const struct lsm_id *lsmid' ../common/include/linux/lsm_hooks.h

      - name: Apply pinned SUSFS kernel patch
        run: |
          set -euo pipefail
          cd kernel_workspace

          git clone --filter=blob:none --no-checkout --depth=1 --branch gki-android16-6.12 \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          git -C susfs4ksu fetch --depth=1 origin "$SUSFS_COMMIT"
          git -C susfs4ksu checkout --detach "$SUSFS_COMMIT"
          test "$(git -C susfs4ksu rev-parse HEAD)" = "$SUSFS_COMMIT"

          cp susfs4ksu/kernel_patches/fs/* kernel_platform/common/fs/
          cp susfs4ksu/kernel_patches/include/linux/* kernel_platform/common/include/linux/
          cp \
            susfs4ksu/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch \
            kernel_platform/common/50_add_susfs.patch

          cd kernel_platform/common
          # OnePlus A.67 has a different comment block immediately after
          # selinux_state. Apply the upstream SUSFS patch everywhere else,
          # then use the audited A.67-only hooks.c context adaptation.
          git apply --check --exclude=security/selinux/hooks.c 50_add_susfs.patch
          # The upstream patch has one whitespace-only line in mm/memory.c.
          git apply --whitespace=fix --exclude=security/selinux/hooks.c 50_add_susfs.patch
          git apply --check "$GITHUB_WORKSPACE/patches/PLK110_A67_susfs_selinux_hooks.patch"
          git apply "$GITHUB_WORKSPACE/patches/PLK110_A67_susfs_selinux_hooks.patch"

          grep -q '#define SUSFS_VERSION "v2.3.0"' include/linux/susfs.h
          grep -q 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile

      - name: Configure pinned SukiSU and SUSFS features
        run: |
          set -euo pipefail
          python3 scripts/prepare_sukisu_config.py
          git -C kernel_workspace/kernel_platform/KernelSU diff --check
          git -C kernel_workspace/kernel_platform/common diff --check
          git -C kernel_workspace/kernel_platform/KernelSU diff > artifacts/SUKISU_ADAPTATIONS.patch
          printf 'sukisu=%s\nsusfs=%s\n' "$SUKISU_COMMIT" "$SUSFS_COMMIT" >> artifacts/SOURCE_PINS.txt

      - name: Preserve upstream defconfig and record build adaptations
        run: |
          set -euo pipefail
          common=kernel_workspace/kernel_platform/common
          git -C "$common" diff --exit-code -- arch/arm64/configs/gki_defconfig build.config.gki
          cp "$common/arch/arm64/configs/gki_defconfig" artifacts/upstream_gki_defconfig
          git -C "$common" diff > artifacts/COMMON_BUILD_ADAPTATIONS.patch
          cp "$common/arch/arm64/configs/plk110_sukisu.fragment" artifacts/
          tar -czf artifacts/SUSFS_ADDED_SOURCES.tar.gz -C kernel_workspace/susfs4ksu kernel_patches/fs kernel_patches/include/linux
          cp "$common/arch/arm64/configs/plk110_stock.fragment" artifacts/
          cp "$common/certs/plk110_stock.pem" artifacts/
          git -C kernel_workspace diff -- kernel_platform/build/kernel/kleaf/impl/stamp.bzl > artifacts/KLEAF_STAMP_ADAPTATION.patch
          git -C "$common" diff --name-only -z | xargs -0 -r git -C "$common" update-index --assume-unchanged
          test -z "$(git -C "$common" status -uno --porcelain)"
          (cd kernel_workspace && repo manifest -r) > artifacts/SOURCE_MANIFEST.xml

      - name: Preflight upstream GKI configuration
        run: |
          bash scripts/build_gki.sh preflight
          python3 scripts/verify_gki.py --preflight --additions baselines/PLK110_16.0.8.302_expected_sukisu_susfs.config.additions

      - name: Build the GKI used by official canoe perf
        run: bash scripts/build_gki.sh build

      - name: Verify actual Image config and stock module symbol CRCs
        run: python3 scripts/verify_gki.py --additions baselines/PLK110_16.0.8.302_expected_sukisu_susfs.config.additions

      - name: Verify compiled feature code
        run: |
          set -euo pipefail
          grep -Eq ' [Tt] kernelsu_init$' artifacts/System.map
          grep -Eq ' [Tt] susfs_init$' artifacts/System.map
          python3 - <<'PY'
          from pathlib import Path
          image = Path('artifacts/Image').read_bytes()
          assert b'v4.2.0-e2912817@builtin' in image, 'wrong SukiSU version metadata'
          assert b'v2.3.0' in image, 'SUSFS version missing'
          PY

      - name: Package verified Image
        run: bash scripts/package_gki.sh

      - name: Generate checksums
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts
          (
            cd artifacts
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 -r sha256sum \
              > SHA256SUMS.txt
          )

      - name: Upload reproduction diagnostics and image
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PLK110-A67-SukiSU-4.2-SUSFS-2.3-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
